<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Research Terminal — RESEARCH ONLY</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#0b0e14; --panel:#11151f; --panel2:#161b28; --border:#232a3b;
  --text:#d7dde8; --dim:#7b8496; --accent:#5aa2ff;
  --pos:#22c55e; --pos-bg:rgba(34,197,94,.13);
  --neg:#ef4444; --neg-bg:rgba(239,68,68,.12);
  --amber:#f59e0b; --amber-bg:rgba(245,158,11,.13);
  --gray-bg:rgba(123,132,150,.10);
  --sidew:208px; --sidew-c:52px;
}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:12.5px/1.4 "SF Mono","Cascadia Code",Menlo,Consolas,monospace;display:flex;overflow:hidden}

/* ── app shell: fixed sidebar ── */
#sidebar{width:var(--sidew);min-width:var(--sidew);background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;transition:width .15s,min-width .15s}
body.side-collapsed #sidebar{width:var(--sidew-c);min-width:var(--sidew-c)}
#side-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px}
#side-head h1{font-size:12px;margin:0;color:var(--accent);letter-spacing:.5px;white-space:nowrap;overflow:hidden}
body.side-collapsed #side-head h1{display:none}
#side-toggle{background:none;border:1px solid var(--border);color:var(--dim);border-radius:4px;cursor:pointer;padding:2px 7px;font:inherit}
#side-toggle:hover{color:var(--text)}
#sidebar .sub{font-size:9px;color:var(--dim);margin:0 12px 10px;white-space:nowrap;overflow:hidden}
body.side-collapsed #sidebar .sub{display:none}
#nav{overflow-y:auto;flex:1}
#nav a{display:flex;align-items:center;gap:8px;padding:6px 14px;color:var(--dim);text-decoration:none;border-left:2px solid transparent;cursor:pointer;white-space:nowrap}
#nav a.active{color:var(--text);background:var(--panel2);border-left-color:var(--accent)}
#nav a:hover{color:var(--text)}
/* expanded: names only (no initials badge clutter); collapsed: centered
   initials with title tooltips carrying the full page name */
#nav .ini{display:none;width:24px;min-width:24px;text-align:center;font-size:10px;color:var(--accent);background:var(--panel2);border:1px solid var(--border);border-radius:3px;padding:1px 0}
#nav .lbl{overflow:hidden;text-overflow:ellipsis}
body.side-collapsed #nav .ini{display:inline-block}
body.side-collapsed #nav .lbl,body.side-collapsed #nav .ph{display:none}
body.side-collapsed #nav a{justify-content:center;padding:6px 0}
body.side-collapsed #nav a.active .ini{border-color:var(--accent);color:var(--text)}
#nav .ph{font-size:8px;color:var(--dim);margin-left:auto;opacity:.8}
#side-foot{padding:8px 12px;font-size:9px;color:var(--dim);border-top:1px solid var(--border);white-space:normal}
body.side-collapsed #side-foot{display:none}

/* ── main column: fixed header + tabs + scrolling workspace ── */
#main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh}
#gheader{padding:7px 12px 6px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0}
#gheader .hrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
#gheader .hrow.data{margin-top:4px}
#gheader .hrow.data .chip{font-size:9.5px;padding:1px 6px}
#gheader .grp{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-right:2px}
.chip{padding:2px 8px;border-radius:4px;background:var(--panel2);border:1px solid var(--border);font-size:10.5px;white-space:nowrap;color:var(--dim)}
.chip b{color:var(--text)}
.chip.ok b{color:var(--pos)} .chip.bad b{color:var(--neg)} .chip.warn b{color:var(--amber)} .chip.info b{color:var(--accent)}

/* ── status badge system: one consistent pill per status value ──
   green = healthy · amber = caution / intentional safety gate (Phase 4B
   BLOCKED is amber, not red — it is a gate, not a failure) · red = failure
   · gray = missing / immature / pending */
.bdg{display:inline-block;padding:1px 8px;border-radius:9px;font-size:10px;font-weight:700;letter-spacing:.3px;border:1px solid;white-space:nowrap}
.bdg.g{color:var(--pos);border-color:rgba(34,197,94,.5);background:var(--pos-bg)}
.bdg.a{color:var(--amber);border-color:rgba(245,158,11,.5);background:var(--amber-bg)}
.bdg.r{color:var(--neg);border-color:rgba(239,68,68,.5);background:var(--neg-bg)}
.bdg.n{color:var(--dim);border-color:var(--border);background:var(--gray-bg)}

#tabbar{display:flex;gap:2px;background:var(--panel);border-bottom:1px solid var(--border);padding:0 8px;flex-shrink:0;overflow-x:auto}
#tabbar .tab{display:flex;align-items:center;gap:6px;padding:5px 10px;font-size:11px;color:var(--dim);cursor:pointer;border:1px solid transparent;border-bottom:none;border-radius:5px 5px 0 0;white-space:nowrap}
#tabbar .tab.active{color:var(--text);background:var(--bg);border-color:var(--border)}
#tabbar .tab .x{color:var(--dim);padding:0 2px} #tabbar .tab .x:hover{color:var(--neg)}

#workspace{flex:1;overflow:auto;padding:12px}

/* ── card system: 1px border, panel background, 14px padding, 12px gaps,
      uppercase muted header, optional top accent for important cards ── */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:14px 16px}
.card.accent{border-top:2px solid var(--accent)}
.card.accent-warn{border-top:2px solid var(--amber)}
.card h3{margin:0 0 10px;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
.card .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:11.5px;align-items:center}
.card .kv .k{color:var(--dim)} .card .kv .v{text-align:right}
.card .big{font-size:20px;font-weight:700;font-family:inherit}
.v.ok{color:var(--pos)} .v.bad{color:var(--neg)} .v.warn{color:var(--amber)} .v.info{color:var(--accent)}
.card.action{cursor:pointer;transition:border-color .12s,transform .12s,box-shadow .12s;outline:none}
.card.action:hover,.card.action:focus-visible{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.35)}
.card.action .go{color:var(--accent);font-size:11px}
/* warnings: amber reserved for the icon + count; body text stays muted */
.warnlist{font-size:11px} .warnlist div{padding:4px 0;border-bottom:1px solid rgba(35,42,59,.5);color:var(--dim)}
.warnlist div:last-child{border-bottom:none}
.warnlist .wi{color:var(--amber);margin-right:6px}
.note{margin-top:8px;padding:6px 8px;background:var(--panel2);border:1px solid var(--border);border-radius:4px;font-size:10.5px;color:var(--dim);line-height:1.5}

/* ── leaderboard ── */
#board-toolbar{display:flex;gap:12px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
#filter{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font:inherit;width:190px}
#board-toolbar .sum{color:var(--dim);font-size:11px}
#board-toolbar .key{color:var(--dim);font-size:10px;margin-left:auto}
/* natural column widths + horizontal scroll via the workspace container —
   prevents right-side columns (Category etc.) being crushed; sticky header
   keeps working because #workspace remains the scroll container */
table{border-collapse:collapse;width:max-content;min-width:100%;font-size:11.5px}
th,td{min-width:0} th{min-width:46px}
th{position:sticky;top:0;z-index:5;background:var(--panel);color:var(--dim);text-align:left;padding:5px 7px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--text)} th.sorted{color:var(--accent)}
th .arr{font-size:9px;color:var(--accent)}
td{padding:3px 7px;border-bottom:1px solid rgba(35,42,59,.45);white-space:nowrap}
tr.row{cursor:pointer} tr.row:hover{background:var(--panel2)}
tr.row.sel{background:rgba(90,162,255,.10);outline:1px solid rgba(90,162,255,.35)}
td.tick{color:var(--accent);font-weight:700}
td.co{max-width:180px;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
.cell{display:inline-block;min-width:50px;text-align:right;padding:0 5px;border-radius:3px}
.pos{color:var(--pos);background:var(--pos-bg)} .neg{color:var(--neg);background:var(--neg-bg)}
.miss{color:var(--dim);background:var(--gray-bg)} .amber{color:var(--amber);background:var(--amber-bg)}
.tag{padding:1px 6px;border-radius:3px;font-size:10px;background:var(--panel2);border:1px solid var(--border);color:var(--dim)}
.tag.q{color:var(--amber);border-color:var(--amber)}
.tag.hp{color:var(--pos);border-color:var(--pos)}
/* row warning icon: quiet until the row is hovered or selected */
.wico{font-size:9px;color:var(--amber);opacity:.45;cursor:help}
tr.row:hover .wico,tr.row.sel .wico{opacity:1}

/* ── drawer ── */
#drawer{position:fixed;top:0;right:-480px;width:460px;height:100vh;background:var(--panel);border-left:1px solid var(--border);transition:right .18s ease;z-index:30;display:flex;flex-direction:column}
#drawer.open{right:0}
#d-head{padding:12px 16px;border-bottom:1px solid var(--border)}
#d-head .top{display:flex;justify-content:space-between;align-items:center}
#d-head h2{margin:0;font-size:15px;color:var(--accent)}
#d-head .co{color:var(--dim);font-size:11px;margin:2px 0 6px}
#d-head .chips{display:flex;gap:5px;flex-wrap:wrap}
#d-head button{background:none;border:1px solid var(--border);color:var(--dim);border-radius:4px;cursor:pointer;padding:2px 9px;font:inherit}
#drawer .body{padding:10px 16px;overflow-y:auto;flex:1}
#drawer .sect{margin-bottom:12px;background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:8px 10px}
#drawer .sect h3{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin:0 0 6px}
#drawer .kv{display:grid;grid-template-columns:128px 1fr;gap:2px 10px;font-size:11.5px}
#drawer .kv .k{color:var(--dim)} #drawer .kv .v{color:var(--text);word-break:break-word}
#drawer footer{padding:9px 16px;border-top:1px solid var(--border);font-size:10px;color:var(--amber)}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none}
#overlay.open{display:block}

/* charts */
.chart{margin:6px 0 10px} .chart .ttl{font-size:10px;color:var(--dim);margin-bottom:2px;display:flex;justify-content:space-between}
.chart svg{display:block;background:var(--bg);border:1px solid var(--border);border-radius:4px}
.legend{font-size:9px;color:var(--dim);margin-top:2px}
.legend i{display:inline-block;width:8px;height:2px;vertical-align:middle;margin:0 3px 0 8px}

/* placeholders — professional empty-state cards */
.stub{max-width:520px;margin:64px auto;text-align:center;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:36px 32px}
.stub h2{color:var(--text);margin:0 0 10px;font-size:14px;letter-spacing:.4px}
.stub p{color:var(--dim);margin:0 0 16px;font-size:12px;line-height:1.6}
.banner{background:var(--amber-bg);border:1px solid var(--amber);color:var(--amber);padding:6px 12px;border-radius:4px;font-size:11px;margin-bottom:10px}
h2.pg{font-size:13px;margin:0 0 10px;color:var(--text)}
</style>
</head>
<body>

<aside id="sidebar">
  <div id="side-head">
    <h1>RESEARCH TERMINAL</h1>
    <button id="side-toggle" title="collapse / expand sidebar">⟨⟩</button>
  </div>
  <p class="sub">RESEARCH ONLY · cache-only · read-only</p>
  <nav id="nav"></nav>
  <div id="side-foot">Research only — not a signal or recommendation.</div>
</aside>

<div id="main">
  <div id="gheader"></div>
  <div id="tabbar"></div>
  <div id="workspace"></div>
</div>

<div id="overlay" onclick="closeDrawer()"></div>
<div id="drawer">
  <div id="d-head"></div>
  <div class="body" id="d-body"></div>
  <footer id="d-footer">Research only — not a signal or recommendation.</footer>
</div>

<script>
"use strict";
/* Research Terminal shell — Phase 2.5.
   RESEARCH_ONLY: renders cached research artifacts only.
   GET-only client; nothing here can mutate anything. */

const NAV = [
  {id:"home",       label:"Research Home",       ini:"HM"},
  {id:"alpha",      label:"Alpha Radar",          ini:"AR"},
  {id:"board",      label:"Scanner Leaderboard",  ini:"SL"},
  {id:"forward-evidence", label:"Forward Evidence", ini:"FE"},
  {id:"sector-compass",   label:"Sector Compass",   ini:"SC"},
  {id:"social-arb",       label:"Social Arb",       ini:"SA"},
  {id:"fundamental-lens", label:"Fundamental Lens", ini:"FL", stub:5},
  {id:"universe",   label:"Universe Health",      ini:"UH"},
  {id:"data-quality",     label:"Data Quality",    ini:"DQ"},
  {id:"hp",         label:"High Priority Review", ini:"HP"},
  {id:"extended",   label:"Extended / Crowded",   ini:"EX"},
  {id:"young",      label:"Young Listings",       ini:"YL"},
  {id:"mot",        label:"Moment of Truth",      ini:"MT"},
  {id:"research-journal", label:"Research Journal", ini:"RJ", stub:6},
];

let BOARD=null, STATUS=null;
let sortKey="research_score", sortDir=-1, filterText="", selectedTicker=null;
let activePage="home";
let openTabs=["home"];           // workspace tab row — local UI state only

const $=s=>document.querySelector(s);
const fmt=(v,d=2)=>(v===null||v===undefined||Number.isNaN(v))?"—":Number(v).toFixed(d);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const navLabel=id=>(NAV.find(n=>n.id===id)||{}).label||id;

function heat(v){
  if(v===null||v===undefined) return `<span class="cell miss">—</span>`;
  const cls=v>0?"pos":v<0?"neg":"miss";
  return `<span class="cell ${cls}">${v>0?"+":""}${Number(v).toFixed(1)}%</span>`;
}

/* ── status badge system ──
   green = healthy · amber = caution or intentional safety gate (Phase 4B
   BLOCKED is a gate, not a failure → amber) · red = failure · gray =
   missing / immature / pending. Unknown values default to gray. */
const BADGE_GREEN=["PASS","READY","FRESH","RESEARCH_ONLY","OK","UNBLOCKED","PROMISING"];
const BADGE_AMBER=["BLOCKED","NEED_MORE_DATA","INCONCLUSIVE","MIXED","PARTIAL","STALE",
  "SUSPECT","DATA_QUARANTINE","IMMATURE_FORWARD_EVIDENCE","WARN","QUARANTINE",
  "STALE_PRICE","INSUFFICIENT_HISTORY","BENCHMARK_MISSING","SUSPECT_FEED",
  "TOO_EARLY","EARLY_SIGNAL","NO_FORWARD_EDGE","CONFLICTED"];
const BADGE_RED=["FAIL","MISSING","ERROR"];
function badgeClass(v){
  const u=String(v??"").toUpperCase();
  if(BADGE_GREEN.includes(u))return "g";
  if(BADGE_AMBER.includes(u))return "a";
  if(BADGE_RED.includes(u))return "r";
  return "n";  // NO_DATA, MISSING_ARTIFACT, TODO, unknown
}
function badge(v){
  if(v===null||v===undefined||v==="")return `<span class="bdg n">—</span>`;
  return `<span class="bdg ${badgeClass(v)}">${esc(v)}</span>`;
}

/* ── sidebar + tabs (app shell) ── */
function renderNav(){
  $("#nav").innerHTML = NAV.map(n=>
    `<a data-id="${n.id}" class="${n.id===activePage?"active":""}" title="${n.label}">
       <span class="ini">${n.ini}</span><span class="lbl">${n.label}</span>
       ${n.stub?`<span class="ph">P${n.stub}</span>`:""}</a>`).join("");
  document.querySelectorAll("#nav a").forEach(a=>a.onclick=()=>openPage(a.dataset.id));
}
function renderTabs(){
  $("#tabbar").innerHTML = openTabs.map(id=>
    `<span class="tab ${id===activePage?"active":""}" data-id="${id}">${navLabel(id)}
       ${openTabs.length>1?`<span class="x" data-x="${id}" title="close tab">✕</span>`:""}</span>`).join("");
  document.querySelectorAll("#tabbar .tab").forEach(t=>t.onclick=e=>{
    if(e.target.dataset.x){ closeTab(e.target.dataset.x); return; }
    activePage=t.dataset.id; renderNav(); renderTabs(); renderPage();
  });
}
const MAX_TABS=6;   // cap the tab row — oldest non-active tab is evicted
function openPage(id){
  activePage=id;
  if(!openTabs.includes(id)) openTabs.push(id);
  while(openTabs.length>MAX_TABS){
    const evict=openTabs.find(t=>t!==activePage);
    if(!evict)break;
    openTabs=openTabs.filter(t=>t!==evict);
  }
  renderNav(); renderTabs(); renderPage();
}
function closeTab(id){
  openTabs=openTabs.filter(t=>t!==id);
  if(!openTabs.length) openTabs=["home"];
  if(activePage===id) activePage=openTabs[openTabs.length-1];
  renderNav(); renderTabs(); renderPage();
}
$("#side-toggle").onclick=()=>document.body.classList.toggle("side-collapsed");

/* ── global header (persistent) — status values render as badges ── */
function chip(label,value,cls){return `<span class="chip ${cls||""}">${label}: <b>${esc(value)}</b></span>`;}
function chipB(label,value){return `<span class="chip">${label}: ${badge(value)}</span>`;}
function renderHeader(){
  const s=STATUS||{}, p4=s.phase_4b||{};
  // Row 1: safety-critical status — never hidden or demoted.
  const primary=[
    chipB("MODE", s.mode||"RESEARCH_ONLY"),
    chipB("NIGHTLY", s.nightly_status??"?"),
    chipB("PHASE 4B", p4.status??"?"),
    `<span class="chip">VERDICT: ${badge(s.operating_verdict)} <span style="color:var(--dim)">tracker</span> ${badge(s.tracker_verdict)}</span>`,
    chip("MATURED 5D", s.matured_5d??"—"),
    chip("MATURED 10D", s.matured_10d??"—"),
    chipB("BENCHMARKS", s.benchmark_readiness??"?"),
    chip("REGIME", s.market_regime??"?","info"),
  ];
  // Row 2: data-hygiene chips, grouped + slightly smaller.
  const data=[
    `<span class="grp">Data:</span>`,
    chipB("FRESHNESS", s.data_freshness??"?"),
    chip("STALE SKIPPED", s.stale_skipped??"—",(s.stale_skipped||0)>0?"warn":""),
    chip("SUSPECT SKIPPED", s.suspect_skipped??"—",(s.suspect_skipped||0)>0?"warn":""),
    chip("QUARANTINE", s.quarantine_count??"—",(s.quarantine_count||0)>0?"warn":""),
  ];
  if((s.missing_artifacts||[]).length)
    data.push(chip("MISSING ARTIFACTS", s.missing_artifacts.join(", "),"bad"));
  $("#gheader").innerHTML=
    `<div class="hrow">${primary.join("")}</div>`+
    `<div class="hrow data">${data.join("")}</div>`;
}

/* ── Research Home ── */
function card(title,body,cls){return `<div class="card ${cls||""}">${title?`<h3>${title}</h3>`:""}${body}</div>`;}
function kvRow(k,v,cls){return `<div class="k">${k}</div><div class="v ${cls||""}">${v??"—"}</div>`;}
function actionCard(title,desc,page){
  return `<div class="card action" data-page="${page}" tabindex="0" role="button"
    aria-label="open ${title}"><h3>${title}</h3>
    <div style="color:var(--dim);font-size:11px;margin-bottom:6px">${desc}</div>
    <span class="go">open →</span></div>`;
}
function renderHome(){
  const s=STATUS||{}, p4=s.phase_4b||{};
  const rows=(BOARD||{}).rows||[];
  const nHP=rows.filter(r=>(r.label||"").includes("HIGH_PRIORITY")).length;
  const nRR=rows.filter(r=>(r.label||"").match(/RESET_WATCH|RECLAIM_WATCH/)).length;
  const nEXT=rows.filter(r=>(r.label||"").match(/EXTENDED|CROWDED/)).length;
  const nYQ=rows.filter(r=>r.warnings.includes("INSUFFICIENT_HISTORY")||r.data_quality==="QUARANTINE").length;
  const qb=s.quarantine_breakdown||{};
  $("#workspace").innerHTML=`
    <h2 class="pg">Research Home</h2>
    <div class="cards">
      ${card("Engine status",`<div class="kv">
        ${kvRow("Mode",badge("RESEARCH_ONLY"))}
        ${kvRow("Phase 4B",badge(p4.status))}
        ${kvRow("Verdict",badge(s.operating_verdict))}
        ${kvRow("Tracker verdict",badge(s.tracker_verdict))}
      </div><div class="note">${esc(p4.reason||"—")}</div>`,"accent-warn")}
      ${card("Evidence readiness",`<div class="kv">
        ${kvRow("Matured 5d",`<span class="big">${s.matured_5d??"—"}</span>`)}
        ${kvRow("Matured 10d",`<span class="big">${s.matured_10d??"—"}</span>`)}
        ${kvRow("Total tracked",s.total_tracked??"—")}
        ${kvRow("Sample maturity",badge(s.sample_status))}
        ${kvRow("Benchmarks",badge(s.benchmark_readiness))}
      </div>`,"accent")}
      ${card("Data quality",`<div class="kv">
        ${kvRow("Freshness",badge(s.data_freshness))}
        ${kvRow("Stale-price skipped",s.stale_skipped??"—",(s.stale_skipped||0)>0?"warn":"")}
        ${kvRow("Suspect feeds skipped",s.suspect_skipped??"—",(s.suspect_skipped||0)>0?"warn":"")}
        ${kvRow("Quarantine",s.quarantine_count??"—",(s.quarantine_count||0)>0?"warn":"")}
        ${kvRow("Insufficient history",qb.INSUFFICIENT_HISTORY??"—")}
      </div>`)}
      ${card("Candidate summary",`<div class="kv">
        ${kvRow("Total candidates",`<span class="big">${rows.length}</span>`)}
        ${kvRow("High priority",nHP,nHP>0?"ok":"")}
        ${kvRow("Reset / reclaim",nRR)}
        ${kvRow("Extended / crowded",nEXT,nEXT>0?"warn":"")}
        ${kvRow("Young / quarantine",nYQ,nYQ>0?"warn":"")}
      </div>`)}
    </div>
    ${card(`Warnings — last nightly run <span class="bdg ${(s.warnings||[]).length?"a":"n"}">${(s.warnings||[]).length}</span>`,
      `<div class="warnlist">

const COLS=[
  ["ticker","Ticker"],["company","Company"],["price","Price"],
  ["r1d","1D"],["r5d","5D"],["r10d","10D"],["r20d","20D"],
  ["b_spy","vs SPY"],["b_qqq","vs QQQ"],["b_sec","vs Sector"],
  ["rs_20d_vs_spy","RS"],["sector","Sector"],["sector_etf","ETF"],
  ["label","Label"],["scanner_category","Category"],["source","Source"],
  ["confidence","Conf"],["data_quality","DQ"],
];
function cellVal(r,k){
  switch(k){
    case "r1d":return r.returns["1d"];case "r5d":return r.returns["5d"];
    case "r10d":return r.returns["10d"];case "r20d":return r.returns["20d"];
    case "b_spy":return r.benchmarks.spy;case "b_qqq":return r.benchmarks.qqq;
    case "b_sec":return r.benchmarks.sector;
    default:return r[k];
  }
}
function rowsFiltered(rows){
  let out=rows;
  if(filterText){
    const q=filterText.toUpperCase();
    out=out.filter(r=>(r.ticker||"").includes(q)||(r.company||"").toUpperCase().includes(q)||
      (r.label||"").toUpperCase().includes(q)||(r.sector||"").toUpperCase().includes(q));
  }
  if(activePage==="hp") out=out.filter(r=>(r.label||"").includes("HIGH_PRIORITY"));
  if(activePage==="extended") out=out.filter(r=>(r.label||"").match(/EXTENDED|RESET_WATCH|CROWDED/));
  if(activePage==="young") out=out.filter(r=>r.warnings.includes("INSUFFICIENT_HISTORY"));
  if(activePage==="alpha") out=out.filter(r=>
    ["alpha_board","daily_alpha_radar"].includes(r.source)||(r.label||"").match(/HIGH_PRIORITY|WATCHLIST_RESEARCH|RESET_WATCH|RECLAIM_WATCH/));
  return out;
}
function renderBoard(){
  const b=BOARD||{rows:[]};
  if(b.fallback==="MISSING_ARTIFACT"){
    $("#workspace").innerHTML=`<div class="banner">Scanner artifact missing — run the nightly research cycle to populate this board. (MISSING_ARTIFACT)</div>`;
    return;
  }
  let rows=rowsFiltered(b.rows.slice());
  rows.sort((a,b2)=>{
    const va=cellVal(a,sortKey),vb=cellVal(b2,sortKey);
    if(va===null||va===undefined)return 1;if(vb===null||vb===undefined)return -1;
    return (va<vb?-1:va>vb?1:0)*sortDir;
  });
  const head=COLS.map(([k,l])=>
    `<th data-k="${k}" class="${k===sortKey?"sorted":""}">${l}${k===sortKey?`<span class="arr"> ${sortDir<0?"▼":"▲"}</span>`:""}</th>`).join("");
  const body=rows.map(r=>{
    const warn=r.warnings.length>0;
    const lblCls=(r.label||"").includes("HIGH_PRIORITY")?"hp":((r.label||"").match(/QUARANTINE|CONFLICT|EXTENDED/)?"q":"");
    return `<tr class="row ${r.ticker===selectedTicker?"sel":""}" data-t="${r.ticker}">
      <td class="tick">${r.ticker}${warn?` <span class="wico" title="${esc(r.warnings.join(", "))}">⚠</span>`:""}</td>

      <td>${heat(r.returns["1d"])}</td><td>${heat(r.returns["5d"])}</td>
      <td>${heat(r.returns["10d"])}</td><td>${heat(r.returns["20d"])}</td>
      <td>${heat(r.benchmarks.spy)}</td><td>${heat(r.benchmarks.qqq)}</td><td>${heat(r.benchmarks.sector)}</td>
      <td>${heat(r.rs_20d_vs_spy)}</td>
      <td>${esc(r.sector)||"—"}</td><td>${esc(r.sector_etf)||"—"}</td>
      <td><span class="tag ${lblCls}" title="${esc(r.watchlist_label)}">${esc(r.label)||"—"}</span></td>
      <td>${esc(r.scanner_category)||"—"}</td>

      <td>${esc(r.confidence)||"—"}</td>
      <td><span title="${esc(r.warnings.join(", ")||"no warnings")}">${badge(r.data_quality)}</span></td>
    </tr>`;
  }).join("");
  // Alpha Radar is a curated research-queue subset of the full leaderboard —
  // give it a summary strip so it reads differently at a glance.
  let strip="";
  if(activePage==="alpha"){
    const nHP=rows.filter(r=>(r.label||"").includes("HIGH_PRIORITY")).length;
    const nRR=rows.filter(r=>(r.label||"").match(/RESET_WATCH|RECLAIM_WATCH/)).length;
    const nEXT=rows.filter(r=>(r.label||"").match(/EXTENDED|CROWDED/)).length;
    const nYQ=rows.filter(r=>r.warnings.includes("INSUFFICIENT_HISTORY")||r.data_quality==="QUARANTINE").length;
    strip=`<div id="alpha-strip" class="hrow" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center">
      <span class="chip">HIGH PRIORITY: <b>${nHP}</b></span>

      <span style="color:var(--dim);font-size:10px">curated research queue — the full candidate table lives in Scanner Leaderboard</span>
    </div>`;
  }
  $("#workspace").innerHTML=`
    <h2 class="pg">${esc(navLabel(activePage))}</h2>

      <input id="filter" placeholder="filter ticker / sector / label" value="${esc(filterText)}">

    </div>

    const v=$("#filter").value;$("#filter").setSelectionRange(v.length,v.length);};
}

const pct=(v,d=2)=>(v===null||v===undefined)?"—":`${v>0?"+":""}${Number(v).toFixed(d)}%`;
const wr=v=>(v===null||v===undefined)?"—":`${(v*100).toFixed(0)}%`;
function cohortTable(title,rows,opts={}){
  if(!rows||!rows.length) return card(title,`<div style="color:var(--dim);font-size:11px">no data</div>`);

    <th>avg 5d</th><th>avg 10d</th><th>med 10d</th><th>win 10d</th>
    <th>vs SPY</th><th>vs QQQ</th><th>vs Sector</th><th>Maturity</th>
    ${isTracker?"<th>Tracker verdict</th>":""}</tr>`;
  const body=rows.map(r=>{
    const name=r.cohort||r.bucket||"?";
    return `<tr>
      <td class="tick">${esc(name)}</td>
      <td>${r.n_entries??r.total_entries??"—"}</td>
      <td>${r.n_matured_5d??r.matured_5d_entries??"—"}</td>
      <td>${r.n_matured_10d??r.matured_entries??"—"}</td>
      <td>${heat(r.avg_ret_5d)}</td>
      <td>${heat(r.avg_ret_10d??r.mean_ret_10d)}</td>
      <td>${heat(r.median_ret_10d)}</td>
      <td>${wr(r.win_rate_10d)}</td>
      <td>${heat(r.mean_vs_spy_10d??r.avg_ret_vs_spy)}</td>
      <td>${heat(r.mean_vs_qqq_10d??r.avg_ret_vs_qqq)}</td>
      <td>${heat(r.mean_vs_sector_10d??r.avg_ret_vs_sector)}</td>
      <td>${badge(r.sample_status)}</td>
      ${isTracker?`<td>${badge(r.verdict)}</td>`:""}
    </tr>`;
  }).join("");
  return card(title,`<table>${head}${body}</table>`);
}
function cohortBars(title,rows,field){
  const items=rows.filter(r=>(r[field]??null)!==null);
  if(!items.length) return "";
  const mx=Math.max(...items.map(r=>Math.abs(r[field])),1);
  const Wb=420,half=Wb/2,h=items.length*16+6;
  let g=`<line x1="${half}" y1="0" x2="${half}" y2="${h}" stroke="#39415a"/>`;
  items.forEach((r,i)=>{
    const y=i*16+3,v=r[field];
    const w=Math.abs(v)/mx*(half-100),x=v>=0?half:half-w;
    g+=`<text x="2" y="${y+9}" fill="#7b8496" font-size="9">${esc((r.cohort||r.bucket||"?").slice(0,22))}</text>
        <rect x="${x.toFixed(1)}" y="${y}" width="${Math.max(w,1).toFixed(1)}" height="11" fill="${v>=0?"#22c55e":"#ef4444"}" opacity=".75"/>
        <text x="${(v>=0?half+w+4:half-w-34).toFixed(1)}" y="${y+9}" fill="${v>=0?"#22c55e":"#ef4444"}" font-size="9">${v>0?"+":""}${v.toFixed(1)}%</text>`;
  });
  return card(title,`<svg width="${Wb}" height="${h}" viewBox="0 0 ${Wb} ${h}">${g}</svg>`);
}

/* ── Phase 3: Sector Compass ── */
function sparkSvg(series){
  if(!series) return "";
  const w=120,h=26,[mn,mx]=scaleSeries([series]);
  let d="",pen=false;
  const n=series.length;
  for(let i=0;i<n;i++){
    const v=series[i];
    if(v===null||v===undefined){pen=false;continue}
    const x=(i/(n-1||1))*w,y=h-((v-mn)/(mx-mn||1))*(h-4)-2;
    d+=(pen?"L":"M")+x.toFixed(1)+","+y.toFixed(1);pen=true;
  }
  let zero="";
  if(mn<0&&mx>0){const zy=h-((0-mn)/(mx-mn))*(h-4)-2;
    zero=`<line x1="0" y1="${zy.toFixed(1)}" x2="${w}" y2="${zy.toFixed(1)}" stroke="#39415a" stroke-dasharray="2,2"/>`;}
  const last=series.filter(v=>v!==null&&v!==undefined).pop()||0;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${zero}<path d="${d}" fill="none" stroke="${last>=0?"#22c55e":"#ef4444"}" stroke-width="1.2"/></svg>`;
}

        <span class="chip">LEADERS: <b>${(d.leaders||[]).join(" ")||"—"}</b></span>
        <span class="chip">LAGGARDS: <b>${(d.laggards||[]).join(" ")||"—"}</b></span>
      </div>
      ${card("Sector ETFs ranked by 20d RS vs SPY",`<table>
        <tr><th>ETF</th><th>Sector</th><th>RS 20d</th><th>RS 63d</th><th>RS trend (64 bars)</th><th>Last bar</th></tr>${body}</table>`)}
      <div class="note">Cumulative relative return vs SPY over the lookback, aligned by date; gaps are never interpolated. Rotation context only — not a signal.</div>`;
  }).catch(()=>{$("#workspace").innerHTML=`<h2 class="pg">Sector Compass</h2><div class="banner">unavailable</div>`;});
}

        <span class="chip">HISTORY DAYS: <b>${d.history_days??"—"}</b></span>

}

/* ── drawer (research profile) ── */

      <div class="chips">
        <span class="tag ${(d.label||"").includes("HIGH_PRIORITY")?"hp":""}">${esc(d.label)||"—"}</span>

      </div>

        ${kv("Appeared",esc(fwd.appearance_date))}
        ${kv("5d",mat.has_5d?heat(fr["5d"]):`<span class="cell miss">immature</span>`)}

        ${kv("10d vs SPY",heat(fb.spy))}${kv("10d vs QQQ",heat(fb.qqq))}

      </div></div>

        ${kv("Quality",badge(d.data_quality))}

        ${kv("Market cap",d.market_cap?`$${(d.market_cap/1e9).toFixed(2)}B`:"—")}
        ${kv("RS 20d / 63d vs SPY",`${fmt(d.rs_20d_vs_spy,1)}pp / ${fmt(d.rs_63d_vs_spy,1)}pp`)}

      </div></div>

function closeDrawer(){$("#drawer").classList.remove("open");$("#overlay").classList.remove("open");}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});

/* ── Phase 2 charts (read-only research visuals, inline SVG) ── */
const W=408,LH=86,VH=44;
function scaleSeries(all){
  let mn=Infinity,mx=-Infinity;
  all.forEach(s=>(s||[]).forEach(v=>{if(v!==null&&v!==undefined){if(v<mn)mn=v;if(v>mx)mx=v;}}));
  if(!isFinite(mn)){mn=0;mx=1}if(mn===mx){mn-=1;mx+=1}
  return [mn,mx];
}
function pathFor(s,mn,mx,h){
  const n=s.length;let d="",pen=false;
  for(let i=0;i<n;i++){
    const v=s[i];
    if(v===null||v===undefined){pen=false;continue}
    const x=(i/(n-1||1))*W,y=h-((v-mn)/(mx-mn))*(h-4)-2;
    d+=(pen?"L":"M")+x.toFixed(1)+","+y.toFixed(1);pen=true;
  }
  return d;
}
function lineChart(title,series,colors,opts={}){
  const h=opts.h||LH,[mn,mx]=scaleSeries(series);
  let inner="";
  if(opts.zero&&mn<0&&mx>0){
    const zy=h-((0-mn)/(mx-mn))*(h-4)-2;
    inner+=`<line x1="0" y1="${zy.toFixed(1)}" x2="${W}" y2="${zy.toFixed(1)}" stroke="#39415a" stroke-dasharray="3,3"/>`;
  }
  series.forEach((s,i)=>{if(s)inner+=`<path d="${pathFor(s,mn,mx,h)}" fill="none" stroke="${colors[i]}" stroke-width="1.3"/>`;});
  return `<div class="chart"><div class="ttl"><span>${title}</span><span>${mn.toFixed(1)} … ${mx.toFixed(1)}</span></div>
    <svg width="${W}" height="${h}" viewBox="0 0 ${W} ${h}">${inner}</svg>${opts.legend||""}</div>`;
}
function volChart(vol){
  if(!vol)return "";
  const mx=Math.max(...vol.filter(v=>v!==null),1);
  const n=vol.length,bw=Math.max(1,(W/n)-0.4);
  let bars="";
  for(let i=0;i<n;i++){
    const v=vol[i];if(v===null||v===undefined)continue;
    const bh=(v/mx)*(VH-3),x=(i/(n-1||1))*(W-bw);
    bars+=`<rect x="${x.toFixed(1)}" y="${(VH-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="#3b4a6b"/>`;
  }
  return `<div class="chart"><div class="ttl"><span>Volume</span></div>
    <svg width="${W}" height="${VH}" viewBox="0 0 ${W} ${VH}">${bars}</svg></div>`;
}
function fwdBars(fwd){
  const fb=(fwd||{}).benchmarks_10d||{},fr=(fwd||{}).returns||{};
  const rows=[["5d abs",fr["5d"]],["10d abs",fr["10d"]],["20d abs",fr["20d"]],
              ["10d vs SPY",fb.spy],["10d vs QQQ",fb.qqq],["10d vs sector",fb.sector]];
  const vals=rows.map(r=>r[1]).filter(v=>v!==null&&v!==undefined);
  if(!vals.length)return `<div class="chart"><div class="ttl"><span>Forward vs benchmark</span></div><div style="color:var(--dim);font-size:11px">immature — no matured forward evidence yet</div></div>`;
  const mx=Math.max(...vals.map(Math.abs),1),half=W/2;
  let g="";
  rows.forEach((r,i)=>{
    const y=i*16+3,v=r[1];
    g+=`<text x="2" y="${y+9}" fill="#7b8496" font-size="9">${r[0]}</text>`;
    if(v===null||v===undefined){g+=`<text x="${half+4}" y="${y+9}" fill="#7b8496" font-size="9">—</text>`;return;}
    const w=Math.abs(v)/mx*(half-70),x=v>=0?half:half-w;
    g+=`<rect x="${x.toFixed(1)}" y="${y}" width="${Math.max(w,1).toFixed(1)}" height="11" fill="${v>=0?"#22c55e":"#ef4444"}" opacity=".75"/>
        <text x="${(v>=0?half+w+4:half-w-30).toFixed(1)}" y="${y+9}" fill="${v>=0?"#22c55e":"#ef4444"}" font-size="9">${v>0?"+":""}${v.toFixed(1)}%</text>`;
  });
  const h=rows.length*16+6;
  return `<div class="chart"><div class="ttl"><span>Forward vs benchmark</span></div>
    <svg width="${W}" height="${h}" viewBox="0 0 ${W} ${h}">
      <line x1="${half}" y1="0" x2="${half}" y2="${h}" stroke="#39415a"/>${g}</svg></div>`;
}
function loadCharts(t){
  fetch(`api/series/${encodeURIComponent(t)}`).then(r=>r.json()).then(s=>{
    const el=$("#d-charts");if(!el)return;
    if(s.fallback){el.innerHTML=`<span class="tag q">${esc(s.fallback)}</span> no price series available`;return;}
    const legend=`<div class="legend"><i style="background:#5aa2ff"></i>close<i style="background:#f59e0b"></i>MA50<i style="background:#a855f7"></i>MA200</div>`;
    let html=lineChart(`Price (${s.bars} bars)`,[s.close,s.ma50,s.ma200],["#5aa2ff","#f59e0b","#a855f7"],{legend});
    html+=volChart(s.volume);
    if(s.rs_vs_spy)html+=lineChart("RS vs SPY (cum %, date-aligned)",[s.rs_vs_spy],["#22c55e"],{zero:true,h:64});
    if(s.rs_vs_qqq)html+=lineChart("RS vs QQQ (cum %)",[s.rs_vs_qqq],["#5aa2ff"],{zero:true,h:64});
    if(s.rs_vs_sector)html+=lineChart(`RS vs sector ETF (${esc(s.sector_etf||"?")})`,[s.rs_vs_sector],["#f59e0b"],{zero:true,h:64});
    html+=fwdBars(s.forward);
    if((s.warnings||[]).length)html+=`<div>${s.warnings.map(w=>`<span class="tag q">${esc(w)}</span>`).join(" ")}</div>`;
    el.innerHTML=html;
  }).catch(()=>{const el=$("#d-charts");if(el)el.textContent="chart data unavailable";});
}
