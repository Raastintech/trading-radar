      <div><div class="at">Regime Invalidation</div>
        <div class="abody">${reasons}</div></div></div>`);
  }
  const tension=(mc.context_tension||[]).slice(0,3);
  if(tension.length){
    out.push(`<div class="alert tension-alert"><span class="ai">⚠</span>
      <div><div class="at">Context Tension</div>
        <div class="abody">${tension.map(esc).join("<br>")}</div></div></div>`);
  }
  return out.join("");
}

/* ── Market Context snapshot: 4 primary states, 4 secondary reads, one
   deterministic interpretation line (composed from existing fields only —
   never LLM text) ── */
function staleTag(fr){return fr&&fr.stale?` <span class="freshness-chip stale">Stale</span>`:"";}
const REGIME_PHRASES={
  "Chop / Range":"Range-bound market",
  "Bull Continuation":"Trending bull market",
  "Bull Pullback / Buy-the-Dip":"Bull market in a pullback",
  "Risk-Off":"Risk-off market",
  "Volatility Expansion / Stress":"Stressed high-volatility market",
  "Bear Rally / Unstable Rebound":"Unstable rebound market",
};
function marketInterpretation(mc){
  const regime=((mc.regime||{}).current)||"";
  const hb=((mc.heartbeat||{}).label)||"";
  const breadth=((mc.breadth||{}).state)||"";
  if(!regime&&!hb&&!breadth) return "";
  const bits=[REGIME_PHRASES[regime]||(regime?regime+" market":"Market state unknown")];
  if(hb) bits.push("with "+hb.toLowerCase());
  let line=bits.join(" ");
  if(breadth) line+="; breadth is "+breadth.toLowerCase();
  return line+".";
}
function marketContextStrip(mc){
  if(!mc||!mc.present) return "";
  const f=mc.forecast||{}, hb=mc.heartbeat||{}, fr=mc.freshness||{};
  const cell=(k,v,sub)=>`<div class="mkt-cell"><div class="k">${k}</div>
    <div class="v">${esc(v||"—")}</div>${sub?`<div class="sub">${esc(sub)}</div>`:""}</div>`;
  const fcast=`${f.bias_5d?"5d "+cap1(f.bias_5d):""}${f.bias_10d?" · 10d "+cap1(f.bias_10d):""}`;
  const interp=marketInterpretation(mc);
  return `<div class="mkt-strip">
    <h3>Market Context${staleTag(fr)}${fr.generated_at?` <span class="freshness-chip">Updated ${esc(fmtET(fr.generated_at))}</span>`:""}</h3>
    ${interp?`<div class="interp" style="border-top:none;padding-top:0;margin:0 0 8px">${esc(interp)}</div>`:""}
    <div class="mkt-grid">
      ${cell("Regime",(mc.regime||{}).current,"Confidence: "+cap1((mc.regime||{}).confidence))}
      ${cell("Forecast",fcast||"—","Confidence: "+cap1(f.confidence))}
      ${cell("Heartbeat",hb.label)}
      ${cell("Bias",(mc.bias||{}).posture)}
    </div>
    <div class="mkt-grid" style="margin-top:8px">
      ${cell("Breadth",(mc.breadth||{}).state,(mc.breadth||{}).pct_above_ma20!=null?Math.round(mc.breadth.pct_above_ma20*100)+"% > 20d MA":"")}
      ${cell("Volatility",(mc.volatility||{}).state,(mc.volatility||{}).vix!=null?"VIX "+mc.volatility.vix:"")}
      ${cell("Leadership",(mc.leadership||{}).label)}
      ${cell("Weakness",((mc.leadership||{}).weak||[]).join(" · ")||"—")}
    </div>
    ${(hb.drivers||[]).length?`<details class="prog-det" style="margin-top:6px"><summary>Heartbeat drivers</summary>
      <div class="note" style="margin-top:4px">${(hb.drivers||[]).slice(0,5).map(esc).join(" · ")}</div></details>`:""}
  </div>`;
}

/* ── Level 3: Evidence & Confidence panel (max 6 fields, one line/program) ── */
function evidenceConfidencePanel(rc){
  if(!rc||!rc.present) return "";
  const mot=rc.moment_of_truth||{}, ft=rc.forward_tracking||{}, pv=rc.program_verdicts||{};
  const cell=(k,v,sub)=>`<div class="evc-cell"><div class="k">${k}</div>
    <div class="v">${v||"—"}</div>${sub?`<div class="sub">${esc(sub)}</div>`:""}</div>`;
  // The moment-of-truth is a dated restatement — always show its as-of
  // date so its (older) counts are never read as current tracker state.
  const motAt=(mot.freshness||{}).generated_at;
  const resolverWarn=String(ft.resolver_status||"").toUpperCase()==="WARN";
  const watchWarn=(ft.watchlist_resolution_warning_count||0)>0;
  const resSub="next "+esc(ft.next_maturity_due||"—")
    +(resolverWarn?` · resolver WARN${ft.unresolved_missing_price!=null?" ("+ft.unresolved_missing_price+" missing prices)":""}`:"")
    +(watchWarn?` · watchlist ${ft.watchlist_resolution_warning_count} weak horizon(s)`:"");
  const incompleteWarn=ft.incomplete_evidence_warning||((ft.incomplete_evidence_warnings||[])[0]);
  // Forward-evidence anchor label — deterministic: validated only when a
  // program verdict literally says so; otherwise the collection is in
  // progress (a research maturity state, not a failure).
  const anyVerdict=Object.values(pv).some(Boolean);
  const fwdAnchor=Object.values(pv).includes("VALIDATED_EDGE")?"Validated"
    :anyVerdict?"In Progress":"—";
  return `<div class="evc-panel">
    <h3>Evidence &amp; Confidence</h3>
    <div class="interp" style="border-top:none;padding-top:0;margin:0 0 8px">${esc(evidenceInterpretation(rc))}</div>
    <div class="evc-grid anchors">
      ${cell("Research State",esc(rc.research_state),"Engine "+esc(rc.engine_state))}
      ${cell("Moment of Truth",`<span title="canonical: ${esc(mot.verdict||"?")}">${termLabel(mot.verdict)}</span>`+staleTag(mot.freshness),motAt?"as of "+String(fmtET(motAt)).slice(0,10):"")}
      ${cell("Forward Evidence",esc(fwdAnchor),"per-program verdicts below")}
    </div>
    <div class="evc-grid details">
      ${cell("Tactical",termLabel(pv.TACTICAL))}
      ${cell("Swing",termLabel(pv.SWING))}
      ${cell("Long-Term",termLabel(pv.LONG_TERM))}

/* ── System Trust snapshot (max 5 visible, rest expandable, one
   deterministic interpretation line) ── */
function trustInterpretation(st,rootSi){
  const si=st.scan_integrity||{}, m=(rootSi||{}).manifest||{};
  const readiness=String(si.readiness||"").toUpperCase();
  const bits=[];
  if(si.same_session_coverage_pct!=null) bits.push(si.same_session_coverage_pct+"% same-session coverage");
  const exByReason=m.excluded_by_reason||{};
  const excluded=Object.values(exByReason).reduce((a,b)=>a+(b||0),0);
  const aligned=m.aligned_final_universe_count;
  if(excluded>0) bits.push(`${excluded}${aligned?` of ${aligned+excluded}`:""} names excluded`);
  const stats=bits.join(", ")||"no integrity stats available";
  if(readiness==="BLOCKED") return "Blocked: today’s scan should not be trusted — "+stats+".";
  if(readiness==="DEGRADED") return si.impact_wording||"Usable with caveats — "+stats+".";
  if(readiness==="READY") return "Fully usable: "+stats+".";
  return "Trust state unknown — "+stats+".";
}

/* ── Research Caveats drawer — deterministic classification of the nightly
   warnings plus scan-integrity causes.  Collapsed by default: only the
   severity counts show.  Research-evidence caveats (steel) and data
   integrity warnings (amber) never share one style. ── */
function classifyCaveat(text){
  const t=String(text).toLowerCase();
  if(/recall/.test(t)) return {group:"Scanner recall",kind:"caveat"};
  if(/options overlay|overlay disabled/.test(t)) return {group:"Options overlay",kind:"overlay"};
  if(/forward|matured|evidence|verdict|re-audit/.test(t)) return {group:"Evidence maturity",kind:"caveat"};
  return {group:"Data coverage",kind:"data"};
}
function collectCaveats(s){
  const items=(s.warnings||[]).map(w=>({text:String(w),...classifyCaveat(w)}));
  const si=s.scan_integrity||{};
  if(/DEGRADED|BLOCKED/i.test(String(si.readiness||""))){
    const cause=(si.readiness_reasons||[]).find(x=>/degraded|blocked|excluded|fail|stale|mismatch/i.test(x));
    if(cause) items.push({text:"Scan integrity: "+cause,group:"Data coverage",kind:"data"});
  }
  return items;
}
function researchCaveats(s){
  const items=collectCaveats(s);
  if(!items.length) return "";
  const n=k=>items.filter(i=>i.kind===k).length;
  const nCv=n("caveat"), nDw=n("data"), nOv=n("overlay");
  const counts=[nCv?`<span class="cv-count">Research caveats: ${nCv}</span>`:"",
                nDw?`<span class="dw-count">Data warnings: ${nDw}</span>`:"",
                nOv?`<span class="ov-count">Optional overlays disabled: ${nOv}</span>`:""]
    .filter(Boolean).join(" · ");
  const groups={};
  items.forEach(i=>{(groups[i.group]=groups[i.group]||{kind:i.kind,list:[]}).list.push(i.text);});
  const body=Object.entries(groups).map(([name,g])=>
    `<div class="cv-group ${g.kind}"><div class="cv-title">${esc(name)}</div>
       ${g.list.map(t=>`<div class="cv-item">${esc(t)}</div>`).join("")}</div>`).join("");
  return `<details class="caveats"><summary>Research Caveats — ${counts}
      <span class="dim" style="font-size:9.5px">(context on today’s evidence, not emergencies — expand for detail)</span></summary>
    <div class="cv-body">${body}</div>
  </details>`;
}
function cap1(v){if(!v)return "—";const s=String(v).toLowerCase();return s.charAt(0).toUpperCase()+s.slice(1);}

/* ── leaderboard ── */
const COLS=[
  ["ticker","Ticker"],["company","Company"],["price","Price"],
  ["r1d","1D"],["r5d","5D"],["r10d","10D"],["r20d","20D"],
  ["b_spy","vs SPY"],["b_qqq","vs QQQ"],["b_sec","vs Sector"],
  ["rs_20d_vs_spy","RS"],["sector","Sector"],["sector_etf","ETF"],
  ["label","Label"],["scanner_category","Category"],["source","Source"],
  ["confidence","Conf"],["data_quality","DQ"],
];
function cellVal(r,k){
  switch(k){
    case "r1d":return r.returns["1d"];case "r5d":return r.returns["5d"];
    case "r10d":return r.returns["10d"];case "r20d":return r.returns["20d"];
    case "b_spy":return r.benchmarks.spy;case "b_qqq":return r.benchmarks.qqq;
    case "b_sec":return r.benchmarks.sector;
    default:return r[k];
  }
}
function rowsFiltered(rows){
  let out=rows;
  if(filterText){
    const q=filterText.toUpperCase();
    out=out.filter(r=>(r.ticker||"").includes(q)||(r.company||"").toUpperCase().includes(q)||
      (r.label||"").toUpperCase().includes(q)||(r.sector||"").toUpperCase().includes(q));
  }
  if(activePage==="hp") out=out.filter(r=>(r.label||"").includes("HIGH_PRIORITY"));
  if(activePage==="extended") out=out.filter(r=>(r.label||"").match(/EXTENDED|RESET_WATCH|CROWDED/));
  if(activePage==="young") out=out.filter(r=>r.warnings.includes("INSUFFICIENT_HISTORY"));
  if(activePage==="alpha") out=out.filter(r=>
    ["alpha_board","daily_alpha_radar"].includes(r.source)||(r.label||"").match(/HIGH_PRIORITY|WATCHLIST_RESEARCH|RESET_WATCH|RECLAIM_WATCH/));
  return out;
}
function renderBoard(){
  const b=BOARD||{rows:[]};
  if(b.fallback==="MISSING_ARTIFACT"){
    $("#workspace").innerHTML=pageHeader(navLabel(activePage),"")
      +stateBanner("missing","Scanner artifact missing — run the nightly research cycle to populate this board.")
      +emptyState("No scanner board yet","The nightly research cycle has not produced a candidate table. Run ./scripts/run_research_cycle.sh nightly.");
    return;
  }
  let rows=rowsFiltered(b.rows.slice());
  rows.sort((a,b2)=>{
    const va=cellVal(a,sortKey),vb=cellVal(b2,sortKey);
    if(va===null||va===undefined)return 1;if(vb===null||vb===undefined)return -1;
    return (va<vb?-1:va>vb?1:0)*sortDir;
  });
  const head=COLS.map(([k,l])=>
    `<th data-k="${k}" class="${k===sortKey?"sorted":""}">${l}${k===sortKey?`<span class="arr"> ${sortDir<0?"▼":"▲"}</span>`:""}</th>`).join("");
  const body=rows.map(r=>{
    const warn=r.warnings.length>0;
    const lblCls=(r.label||"").includes("HIGH_PRIORITY")?"hp":((r.label||"").match(/QUARANTINE|CONFLICT|EXTENDED/)?"q":"");
    return `<tr class="row ${r.ticker===selectedTicker?"sel":""}" data-t="${r.ticker}">
      <td class="tick">${r.ticker}${warn?` <span class="wico" title="${esc(r.warnings.join(", "))}">⚠</span>`:""}</td>
      <td class="co" title="${esc(r.company)}">${esc(r.company)||"—"}</td>
      <td>${r.price!==null&&r.price!==undefined?"$"+fmt(r.price):"—"}</td>
      <td>${heat(r.returns["1d"])}</td><td>${heat(r.returns["5d"])}</td>
      <td>${heat(r.returns["10d"])}</td><td>${heat(r.returns["20d"])}</td>
      <td>${heat(r.benchmarks.spy)}</td><td>${heat(r.benchmarks.qqq)}</td><td>${heat(r.benchmarks.sector)}</td>
      <td>${heat(r.rs_20d_vs_spy)}</td>
      <td>${esc(r.sector)||"—"}</td><td>${esc(r.sector_etf)||"—"}</td>
      <td><span class="tag ${lblCls}" title="${esc(r.watchlist_label)}">${esc(r.label)||"—"}</span></td>
      <td>${esc(r.scanner_category)||"—"}</td>
      <td>${esc(r.source)}</td>
      <td>${esc(r.confidence)||"—"}</td>
      <td><span title="${esc(r.warnings.join(", ")||"no warnings")}">${badge(r.data_quality)}</span></td>
    </tr>`;
  }).join("");
  // Alpha Radar is a curated research-queue subset of the full leaderboard —
  // give it a summary strip so it reads differently at a glance.
  let strip="";
  if(activePage==="alpha"){
    const nHP=rows.filter(r=>(r.label||"").includes("HIGH_PRIORITY")).length;
    const nRR=rows.filter(r=>(r.label||"").match(/RESET_WATCH|RECLAIM_WATCH/)).length;
    const nEXT=rows.filter(r=>(r.label||"").match(/EXTENDED|CROWDED/)).length;
    const nYQ=rows.filter(r=>r.warnings.includes("INSUFFICIENT_HISTORY")||r.data_quality==="QUARANTINE").length;
    strip=`<div id="alpha-strip" class="hrow" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center">
      <span class="chip">HIGH PRIORITY: <b>${nHP}</b></span>
      <span class="chip">RESET / RECLAIM: <b>${nRR}</b></span>
      <span class="chip">EXTENDED / CROWDED: <b>${nEXT}</b></span>
      <span class="chip">QUARANTINE / YOUNG: <b>${nYQ}</b></span>
      <span style="color:var(--dim);font-size:10px">curated research queue — the full candidate table lives in Scanner Leaderboard</span>
    </div>`;
  }
  const subt={board:"Full candidate table — signal strength, not validated alpha",
    alpha:"Curated research queue — a subset of the full leaderboard",
    hp:"Candidates flagged for manual analyst review",
    extended:"Strong profiles currently extended — wait for reset",
    young:"Recently listed names with limited history"}[activePage]||"";
  const disclaimer=activePage==="board"
    ?`<div class="disclaimer">Scanner score reflects signal strength, not validated alpha or business quality. A score of 100 is not High Conviction — see the Command Center for qualified research.</div>`:"";
  $("#workspace").innerHTML=`
    ${pageHeader(navLabel(activePage),subt,{generated_at:b.generated_at})}
    ${disclaimer}
    ${strip}
    <div id="board-toolbar">
      <input id="filter" placeholder="filter ticker / sector / label" value="${esc(filterText)}">
      <span class="sum">${rows.length} of ${b.rows.length} candidates · board ${esc(fmtET(b.generated_at))}</span>
      <span class="key">green = positive · red = negative · gray = missing/immature · amber = warning</span>
    </div>
    <table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  document.querySelectorAll("th").forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=-1;}
    renderBoard();
  });
  document.querySelectorAll("tr.row").forEach(tr=>tr.onclick=()=>{selectedTicker=tr.dataset.t;renderBoard();openDrawer(tr.dataset.t);});
  const f=$("#filter");
  f.oninput=()=>{filterText=f.value;renderBoard();$("#filter").focus();
    const v=$("#filter").value;$("#filter").setSelectionRange(v.length,v.length);};
}

function renderJournal(){
  const f=journalFilters;
  const qs=new URLSearchParams();
  if(f.ticker)qs.set("ticker",f.ticker); if(f.status)qs.set("status",f.status);
  if(f.tag)qs.set("tag",f.tag); qs.set("limit",f.limit||100);
  $("#workspace").innerHTML=`<h2 class="pg">Research Journal</h2><div style="color:var(--dim)">loading…</div>`;
  fetch(`api/journal?${qs}`).then(r=>r.json()).then(d=>{
    let entries=d.entries||[];
    if(f.q){const q=f.q.toLowerCase();
      entries=entries.filter(e=>(e.title||"").toLowerCase().includes(q)||(e.note||"").toLowerCase().includes(q));}
    $("#workspace").innerHTML=`
      ${pageHeader("Research Journal","Manual analyst notes — append-only; never a signal")}

          ${kvRow("Path",`<code>${esc(d.journal_path||"data/research/journal.jsonl")}</code>`)}

          ${(d.statuses||[]).map(s=>`<option ${f.status===s?"selected":""}>${s}</option>`).join("")}
        </select>
        <input id="jf-tag" placeholder="tag" value="${esc(f.tag)}" style="width:90px;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font:inherit">
        <input id="jf-q" placeholder="search text" value="${esc(f.q)}" style="width:140px;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font:inherit">
        <select id="jf-limit" style="background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font:inherit">
          ${[25,100,250,1000].map(n=>`<option ${String(f.limit)===String(n)?"selected":""}>${n}</option>`).join("")}
        </select>

      <div class="note">Research only — not a signal or recommendation.</div>`;
    const apply=()=>{
      journalFilters={ticker:$("#jf-ticker").value.trim(),status:$("#jf-status").value,
        tag:$("#jf-tag").value.trim(),q:$("#jf-q").value.trim(),limit:$("#jf-limit").value};
      renderJournal();

    ["jf-ticker","jf-tag","jf-q"].forEach(id=>{$("#"+id).onkeydown=e=>{if(e.key==="Enter")apply();};});
    $("#jf-status").onchange=apply; $("#jf-limit").onchange=apply;
    const save=$("#j-save");
    if(save)save.onclick=()=>{
      const body={ticker:$("#j-ticker").value.trim().toUpperCase(),
        title:$("#j-title").value.trim(), note:$("#j-note").value.trim(),
        status:$("#j-status").value,
        tags:$("#j-tags").value.split(",").map(s=>s.trim()).filter(Boolean)};
      if(journalPrefill&&journalPrefill.evidence_snapshot&&body.ticker===(journalPrefill.ticker||""))
        body.evidence_snapshot=journalPrefill.evidence_snapshot;
      body.source_view=journalPrefill&&body.ticker===(journalPrefill.ticker||"")?"ticker_drawer":"journal_page";
      const headers={"Content-Type":"application/json"};
      const tok=$("#j-token").value;
      if(tok)headers["X-Research-Journal-Token"]=tok;
      $("#j-msg").textContent="saving…";
      fetch("api/journal",{method:"POST",headers,body:JSON.stringify(body)})
        .then(r=>r.json().then(j=>({ok:r.ok,j})))
        .then(({ok,j})=>{
          if(!ok){$("#j-msg").textContent=`rejected: ${j.error||"?"}`;return;}
          journalPrefill=null; renderJournal();
        }).catch(()=>{$("#j-msg").textContent="request failed";});
    };
  }).catch(()=>{$("#workspace").innerHTML=pageHeader("Research Journal","Manual analyst notes — append-only; never a signal")+stateBanner("error","Request failed — the journal could not be loaded.");});

function cohortBars(title,rows,field){
  const items=rows.filter(r=>(r[field]??null)!==null);
  if(!items.length) return "";
  const mx=Math.max(...items.map(r=>Math.abs(r[field])),1);
  const Wb=420,half=Wb/2,h=items.length*16+6;
  let g=`<line x1="${half}" y1="0" x2="${half}" y2="${h}" stroke="#39415a"/>`;
  items.forEach((r,i)=>{
    const y=i*16+3,v=r[field];
    const w=Math.abs(v)/mx*(half-100),x=v>=0?half:half-w;
    g+=`<text x="2" y="${y+9}" fill="#7b8496" font-size="9">${esc((r.cohort||r.bucket||"?").slice(0,22))}</text>
        <rect x="${x.toFixed(1)}" y="${y}" width="${Math.max(w,1).toFixed(1)}" height="11" fill="${v>=0?"#22c55e":"#ef4444"}" opacity=".75"/>
        <text x="${(v>=0?half+w+4:half-w-34).toFixed(1)}" y="${y+9}" fill="${v>=0?"#22c55e":"#ef4444"}" font-size="9">${v>0?"+":""}${v.toFixed(1)}%</text>`;
  });
  return card(title,`<svg width="${Wb}" height="${h}" viewBox="0 0 ${Wb} ${h}">${g}</svg>`);
}

function sparkSvg(series){
  if(!series) return "";
  const w=120,h=26,[mn,mx]=scaleSeries([series]);
  let d="",pen=false;
  const n=series.length;
  for(let i=0;i<n;i++){
    const v=series[i];
    if(v===null||v===undefined){pen=false;continue}
    const x=(i/(n-1||1))*w,y=h-((v-mn)/(mx-mn||1))*(h-4)-2;
    d+=(pen?"L":"M")+x.toFixed(1)+","+y.toFixed(1);pen=true;
  }
  let zero="";
  if(mn<0&&mx>0){const zy=h-((0-mn)/(mx-mn))*(h-4)-2;
    zero=`<line x1="0" y1="${zy.toFixed(1)}" x2="${w}" y2="${zy.toFixed(1)}" stroke="#39415a" stroke-dasharray="2,2"/>`;}
  const last=series.filter(v=>v!==null&&v!==undefined).pop()||0;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${zero}<path d="${d}" fill="none" stroke="${last>=0?"#22c55e":"#ef4444"}" stroke-width="1.2"/></svg>`;
}

    $("#workspace").innerHTML=`
      ${pageHeader("Sector / Regime","Sector rotation — relative strength vs SPY, date-aligned",{generated_at:d.generated_at})}
      <div class="hrow" style="display:flex;gap:6px;margin-bottom:8px">
        <span class="chip">LEADERS: <b>${(d.leaders||[]).join(" ")||"—"}</b></span>
        <span class="chip">LAGGARDS: <b>${(d.laggards||[]).join(" ")||"—"}</b></span>
      </div>
      ${card("Sector ETFs ranked by 20d RS vs SPY",`<table>
        <tr><th>ETF</th><th>Sector</th><th>RS 20d</th><th>RS 63d</th><th>RS trend (64 bars)</th><th>Last bar</th></tr>${body}</table>`)}
      <div class="note">Cumulative relative return vs SPY over the lookback, aligned by date; gaps are never interpolated. Rotation context only — not a signal.</div>`;
  }).catch(()=>{$("#workspace").innerHTML=pageHeader("Sector / Regime","")+stateBanner("error","Request failed — sector series could not be loaded.");});
}

/* ── Phase 3: Social Arb ── */
function renderSocial(){
  $("#workspace").innerHTML=pageHeader("Social Attention","Attention signals — never framed as alpha; confirmation required")+stateBanner("loading","Loading social attention cohorts…");
  fetch("api/social").then(r=>r.json()).then(d=>{
    if(d.fallback){$("#workspace").innerHTML=pageHeader("Social Attention","Attention signals — never framed as alpha; confirmation required")
      +stateBanner("missing",`${d.fallback} — social attention artifacts unavailable.`)
      +emptyState("No social attention data","No social-attention artifacts have been produced yet.");return;}
    const cohorts=Object.entries(d.by_cohort||{});
    const cohortRows=cohorts.map(([k,v])=>{
      const o=v||{};
      return `<tr><td class="tick">${esc(k)}</td>
        <td>${o.n??o.count??"—"}</td>
        <td>${heat(o.avg_ret_5d??o.mean_5d??null)}</td>
        <td>${heat(o.avg_rel_spy_5d??o.mean_rel_spy_5d??null)}</td></tr>`;
    }).join("");
    const lane=(d.current_lane||[]).map(x=>`<tr>
      <td class="tick">${esc(x.ticker)}</td><td>${x.research_score??"—"}</td>
      <td><span class="tag">${esc(x.watchlist_label)||"—"}</span></td></tr>`).join("");
    // The verdict block and the lane come from two different pipelines on
    // different cadences — show each source's age so they never read as one
    // synchronized snapshot.  >30h = past its daily cadence, flag it.
    const fmtAge=h=>h==null?"—":(h<48?`${Math.round(h)}h`:`${Math.round(h/24)}d`);
    const ageCls=h=>h!=null&&h>30?"warn":"";
    $("#workspace").innerHTML=`
      ${pageHeader("Social Attention","Attention signals — never framed as alpha; confirmation required")}
      <div class="disclaimer">Social interest is not alpha. Cross-check against price, volume, and fundamentals before acting.</div>
      <div class="hrow" style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">
        <span class="chip">VALIDATOR VERDICT: ${badge(d.verdict)}</span>
        ${chip("VALIDATOR AGE",fmtAge(d.validator_age_hours),ageCls(d.validator_age_hours))}
        <span class="chip">MATURED SOCIAL-LED: <b>${d.matured_social_led??"—"}</b></span>
        <span class="chip">HISTORY DAYS: <b>${d.history_days??"—"}</b></span>
        ${chip("LANE AGE (scanner)",fmtAge(d.lane_age_hours),ageCls(d.lane_age_hours))}
      </div>
      <div class="note">${esc(d.verdict_reason||"")}</div>
      <div class="cards" style="margin-top:10px">
        ${card("Forward cohorts (validator-published)",cohortRows?`<table>
          <tr><th>Cohort</th><th>n</th><th>avg 5d</th><th>vs SPY 5d</th></tr>${cohortRows}</table>`
          :`<div style="color:var(--dim);font-size:11px">no matured cohorts published yet</div>`)}
        ${card(`Current social lane (${(d.current_lane||[]).length}) — from scanner`,lane?`<table>
          <tr><th>Ticker</th><th>Score</th><th>Label</th></tr>${lane}</table>`
          :`<div style="color:var(--dim);font-size:11px">no live social candidates</div>`)}
      </div>`;
  }).catch(()=>{$("#workspace").innerHTML=pageHeader("Social Attention","")+stateBanner("error","Request failed — social cohorts could not be loaded.");});
}

/* ── drawer (research profile) ── */

        ${kv("Latest price",d.price!==null&&d.price!==undefined?`$${fmt(d.price)} <span style="color:var(--dim)">(${esc(d.price_date||"?")})</span>`:"—")}
        ${kv("Market cap",d.market_cap?`$${(d.market_cap/1e9).toFixed(2)}B`:"—")}
        ${kv("RS 20d / 63d vs SPY",`${fmt(d.rs_20d_vs_spy,1)}pp / ${fmt(d.rs_63d_vs_spy,1)}pp`)}
        ${kv("Warnings",(d.warnings||[]).length?(d.warnings||[]).map(w=>badge(w)).join(" "):"none")}

    const el=$("#d-fund");if(!el)return;
    if(f.fallback){el.innerHTML=`${badge(f.fallback)} <span style="font-size:11px">no cached statements</span>`;return;}
    const q=f.quality_label;
    const qCls=(q==="PROFITABLE_CASHGEN"||q==="PROFITABLE")?"g":q==="UNPROFITABLE_STRESSED"?"r":q==="UNKNOWN"?"n":"a";
    el.innerHTML=`<div class="kv">
      ${kv("Quality",`<span class="bdg ${qCls}">${esc(q)}</span>`)}

      ${kv("Gross margin",heat(f.gross_margin_pct))}
      ${kv("TTM FCF",money(f.ttm_fcf))}
      ${kv("Net debt",money(f.net_debt))}
      ${kv("P/S (TTM)",f.ps_ttm??"—")}
    </div><div style="color:var(--dim);font-size:9.5px;margin-top:4px">descriptive overlay — full view in Fundamental Lens</div>`;

function closeDrawer(){$("#drawer").classList.remove("open");$("#overlay").classList.remove("open");}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});

/* ── Phase 2 charts (read-only research visuals, inline SVG) ── */
const W=408,LH=86,VH=44;
function scaleSeries(all){
  let mn=Infinity,mx=-Infinity;
  all.forEach(s=>(s||[]).forEach(v=>{if(v!==null&&v!==undefined){if(v<mn)mn=v;if(v>mx)mx=v;}}));
  if(!isFinite(mn)){mn=0;mx=1}if(mn===mx){mn-=1;mx+=1}
  return [mn,mx];
}
function pathFor(s,mn,mx,h){
  const n=s.length;let d="",pen=false;
  for(let i=0;i<n;i++){
    const v=s[i];
    if(v===null||v===undefined){pen=false;continue}
    const x=(i/(n-1||1))*W,y=h-((v-mn)/(mx-mn))*(h-4)-2;
    d+=(pen?"L":"M")+x.toFixed(1)+","+y.toFixed(1);pen=true;
  }
  return d;
}
function lineChart(title,series,colors,opts={}){
  const h=opts.h||LH,[mn,mx]=scaleSeries(series);
  let inner="";
  if(opts.zero&&mn<0&&mx>0){
    const zy=h-((0-mn)/(mx-mn))*(h-4)-2;
    inner+=`<line x1="0" y1="${zy.toFixed(1)}" x2="${W}" y2="${zy.toFixed(1)}" stroke="#39415a" stroke-dasharray="3,3"/>`;
  }
  series.forEach((s,i)=>{if(s)inner+=`<path d="${pathFor(s,mn,mx,h)}" fill="none" stroke="${colors[i]}" stroke-width="1.3"/>`;});
  return `<div class="chart"><div class="ttl"><span>${title}</span><span>${mn.toFixed(1)} … ${mx.toFixed(1)}</span></div>
    <svg width="${W}" height="${h}" viewBox="0 0 ${W} ${h}">${inner}</svg>${opts.legend||""}</div>`;
}
function volChart(vol){
  if(!vol)return "";
  const mx=Math.max(...vol.filter(v=>v!==null),1);
  const n=vol.length,bw=Math.max(1,(W/n)-0.4);
  let bars="";
  for(let i=0;i<n;i++){
    const v=vol[i];if(v===null||v===undefined)continue;
    const bh=(v/mx)*(VH-3),x=(i/(n-1||1))*(W-bw);
    bars+=`<rect x="${x.toFixed(1)}" y="${(VH-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="#3b4a6b"/>`;
  }
  return `<div class="chart"><div class="ttl"><span>Volume</span></div>
    <svg width="${W}" height="${VH}" viewBox="0 0 ${W} ${VH}">${bars}</svg></div>`;
}
function fwdBars(fwd){
  const fb=(fwd||{}).benchmarks_10d||{},fr=(fwd||{}).returns||{};
  const rows=[["5d abs",fr["5d"]],["10d abs",fr["10d"]],["20d abs",fr["20d"]],
              ["10d vs SPY",fb.spy],["10d vs QQQ",fb.qqq],["10d vs sector",fb.sector]];
  const vals=rows.map(r=>r[1]).filter(v=>v!==null&&v!==undefined);
  if(!vals.length)return `<div class="chart"><div class="ttl"><span>Forward vs benchmark</span></div><div style="color:var(--dim);font-size:11px">immature — no matured forward evidence yet</div></div>`;
  const mx=Math.max(...vals.map(Math.abs),1),half=W/2;
  let g="";
  rows.forEach((r,i)=>{
    const y=i*16+3,v=r[1];
    g+=`<text x="2" y="${y+9}" fill="#7b8496" font-size="9">${r[0]}</text>`;
    if(v===null||v===undefined){g+=`<text x="${half+4}" y="${y+9}" fill="#7b8496" font-size="9">—</text>`;return;}
    const w=Math.abs(v)/mx*(half-70),x=v>=0?half:half-w;
    g+=`<rect x="${x.toFixed(1)}" y="${y}" width="${Math.max(w,1).toFixed(1)}" height="11" fill="${v>=0?"#22c55e":"#ef4444"}" opacity=".75"/>
        <text x="${(v>=0?half+w+4:half-w-30).toFixed(1)}" y="${y+9}" fill="${v>=0?"#22c55e":"#ef4444"}" font-size="9">${v>0?"+":""}${v.toFixed(1)}%</text>`;
  });
  const h=rows.length*16+6;
  return `<div class="chart"><div class="ttl"><span>Forward vs benchmark</span></div>
    <svg width="${W}" height="${h}" viewBox="0 0 ${W} ${h}">
      <line x1="${half}" y1="0" x2="${half}" y2="${h}" stroke="#39415a"/>${g}</svg></div>`;
}
function loadCharts(t){
  fetch(`api/series/${encodeURIComponent(t)}`).then(r=>r.json()).then(s=>{
    const el=$("#d-charts");if(!el)return;
    if(s.fallback){el.innerHTML=`<span class="tag q">${esc(s.fallback)}</span> no price series available`;return;}
    const legend=`<div class="legend"><i style="background:#5aa2ff"></i>close<i style="background:#f59e0b"></i>MA50<i style="background:#a855f7"></i>MA200</div>`;
    let html=lineChart(`Price (${s.bars} bars)`,[s.close,s.ma50,s.ma200],["#5aa2ff","#f59e0b","#a855f7"],{legend});
    html+=volChart(s.volume);
    if(s.rs_vs_spy)html+=lineChart("RS vs SPY (cum %, date-aligned)",[s.rs_vs_spy],["#22c55e"],{zero:true,h:64});
    if(s.rs_vs_qqq)html+=lineChart("RS vs QQQ (cum %)",[s.rs_vs_qqq],["#5aa2ff"],{zero:true,h:64});
    if(s.rs_vs_sector)html+=lineChart(`RS vs sector ETF (${esc(s.sector_etf||"?")})`,[s.rs_vs_sector],["#f59e0b"],{zero:true,h:64});
    html+=fwdBars(s.forward);
    if((s.warnings||[]).length)html+=`<div>${s.warnings.map(w=>`<span class="tag q">${esc(w)}</span>`).join(" ")}</div>`;
    el.innerHTML=html;
  }).catch(()=>{const el=$("#d-charts");if(el)el.textContent="chart data unavailable";});
}
