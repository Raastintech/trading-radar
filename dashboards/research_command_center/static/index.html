<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Research Terminal — RESEARCH ONLY</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#0b0e14; --panel:#11151f; --panel2:#161b28; --border:#232a3b;
  --text:#d7dde8; --dim:#7b8496; --accent:#5aa2ff;
  --pos:#22c55e; --pos-bg:rgba(34,197,94,.13);
  --neg:#ef4444; --neg-bg:rgba(239,68,68,.12);
  --amber:#d9a13f; --amber-bg:rgba(217,161,63,.11);
  --gray-bg:rgba(123,132,150,.10);
  --sidew:208px; --sidew-c:52px;
  /* ── severity ladder (presentation only) ──
     critical/blocked = restrained red · degraded-but-usable = muted amber ·
     research caveat / unvalidated evidence = steel-blue · informational =
     neutral slate · good/ready = muted green.  System-integrity problems and
     research-evidence caveats must never share one color. */
  --sev-critical:#d16060;      --sev-critical-bg:rgba(209,96,96,.10);
  --sev-degraded:#d9a13f;      --sev-degraded-bg:rgba(217,161,63,.10);
  --sev-caveat:#7f95b5;        --sev-caveat-bg:rgba(127,149,181,.10);
  --sev-info:#7b8496;          --sev-info-bg:rgba(123,132,150,.10);
  --sev-good:#3fae82;          --sev-good-bg:rgba(63,174,130,.10);
}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:12.5px/1.4 "SF Mono","Cascadia Code",Menlo,Consolas,monospace;display:flex;overflow:hidden}
/* ── interactive affordances: everything clickable looks clickable ── */
details>summary{cursor:pointer;user-select:none;list-style-position:inside}
details>summary:hover{color:var(--text)}
button{cursor:pointer}
button:focus-visible,summary:focus-visible,#nav a:focus-visible,.card.action:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:3px}

.prog-wrap.primary-program .card{border:1px solid var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.prog-wrap.primary-program h3::after{content:" · PRIMARY PROGRAM";font-size:9px;color:var(--amber)}
.cand-row{border-top:1px solid var(--border);padding:6px 0}
.cand-row .dim{color:var(--dim)}
/* cross-horizon badge (+SWING etc.) — informational blue */
.bdg.c{color:var(--accent);border-color:rgba(90,162,255,.5);background:rgba(90,162,255,.10)}
.score{color:var(--text);font-weight:700;font-size:11px;padding:1px 6px;border:1px solid var(--border);border-radius:3px;background:var(--panel2)}
.prog-head{font-size:11px;color:var(--dim);margin:2px 0 6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.prog-toolbar{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
.prog-toolbar select,.prog-toolbar button{background:var(--panel2);border:1px solid var(--border);color:var(--dim);border-radius:4px;font:inherit;font-size:10px;padding:2px 7px;cursor:pointer}
.prog-toolbar button:hover,.prog-toolbar select:hover{color:var(--text)}
.prog-toolbar button.on{color:var(--accent);border-color:var(--accent)}
details.cand-det,details.prog-det,details.issue-det{margin-top:4px;font-size:10.5px}
details.cand-det summary,details.prog-det summary,details.issue-det summary{cursor:pointer;color:var(--dim);font-size:10px}
details.cand-det summary:hover,details.prog-det summary:hover,details.issue-det summary:hover{color:var(--text)}
details.cand-det .kv{margin-top:5px;background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:6px 8px}
.page-note{font-size:10px;color:var(--dim);margin:0 0 8px;padding:5px 8px;border:1px dashed var(--border);border-radius:4px}
/* ── institutional research palette (restrained; distinct from system
   errors, which keep --amber/--neg) ── */
:root{
  --emerald:#3fae82; --emerald-dim:#2f8f6a; --emerald-bg:rgba(63,174,130,.08);
  --indigo:#7c8cf0; --indigo-bg:rgba(124,140,240,.08);
  --violet:#a58cd6; --violet-bg:rgba(165,140,214,.08);
  --steel:#8b96a8;
  /* Consolidated institutional design tokens (aliases so existing rules and
     the new shared components share one palette).  Canonical hues only. */
  --research-emerald:var(--emerald); --research-indigo:var(--indigo);
  --research-violet:var(--violet); --research-steel:var(--steel);
  --research-amber:var(--amber); --research-red:var(--neg);
  --research-bg:var(--bg); --research-surface:var(--panel);
  --research-surface-elevated:var(--panel2); --research-border:var(--border);
  --research-muted:var(--dim);
}
/* ── shared page template components (used by every sidebar tab) ── */
.page-header{margin:0 0 12px}
.page-header .pt{font-size:16px;font-weight:700;color:var(--text);letter-spacing:.3px;margin:0}
.page-header .psubt{font-size:11px;color:var(--research-muted);margin:2px 0 0}
.page-header .pmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.freshness-chip{font-size:9.5px;padding:1px 7px;border-radius:9px;border:1px solid var(--research-border);color:var(--research-muted);background:var(--research-surface)}
.freshness-chip.fresh{color:var(--research-emerald);border-color:rgba(63,174,130,.4)}
.freshness-chip.stale{color:var(--research-amber);border-color:rgba(217,161,63,.4)}
.ro-disclosure{font-size:10px;color:var(--research-muted);border:1px dashed var(--research-border);border-radius:4px;padding:4px 8px;margin:0 0 10px}
/* distinct state banners — loading / no-data / stale / missing / blocked /
   disabled / error each read differently (never one generic red) */
.state{border-radius:6px;padding:8px 12px;margin:0 0 10px;font-size:11px;border:1px solid var(--research-border);background:var(--research-surface)}
.state.loading{color:var(--research-muted)}
.state.empty{color:var(--research-muted);border-style:dashed}
.state.stale{color:var(--research-amber);border-color:rgba(217,161,63,.5)}
.state.missing{color:var(--research-muted);border-color:var(--research-border)}
.state.blocked{color:var(--research-red);border-color:rgba(239,68,68,.5)}
.state.disabled{color:var(--research-muted);border-left:3px solid var(--research-steel)}
.state.error{color:var(--research-red);border-color:rgba(239,68,68,.6);background:var(--neg-bg)}
.empty-state{border:1px dashed var(--research-border);border-radius:8px;padding:26px 22px;text-align:center;color:var(--research-muted);margin:14px 0}
.empty-state h3{margin:0 0 6px;color:var(--text);font-size:13px}
.empty-state p{margin:0;font-size:11.5px;line-height:1.6}
.disclaimer{font-size:10.5px;color:var(--research-muted);border-left:3px solid var(--research-steel);padding:4px 10px;margin:0 0 10px;background:var(--research-surface)}
/* Level-1 Market Context strip */
.mkt-strip{border:1px solid var(--research-border);border-radius:8px;padding:10px 14px;margin-bottom:12px;background:var(--research-surface)}
.mkt-strip h3,.evc-panel h3,.trust-panel h3{margin:0 0 8px;font-size:12px;color:var(--text);letter-spacing:.4px;font-weight:700}
.mkt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px 16px}
.mkt-cell .k{font-size:9.5px;color:var(--research-muted);text-transform:uppercase;letter-spacing:.6px}
.mkt-cell .v{font-size:12.5px;color:var(--text);font-weight:600;margin-top:1px}
.mkt-cell .sub{font-size:9.5px;color:var(--research-muted);margin-top:1px}
.tension{margin-top:8px;font-size:10.5px;color:var(--research-amber);border-left:3px solid var(--research-amber);padding:3px 10px;background:var(--amber-bg)}
/* Level-3 Evidence & Confidence panel */
.evc-panel{border:1px solid var(--research-border);border-top:2px solid var(--research-steel);border-radius:8px;padding:10px 14px;margin-bottom:12px;background:var(--research-surface)}
.evc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px}
.evc-cell .k{font-size:9.5px;color:var(--research-muted);text-transform:uppercase;letter-spacing:.6px}
.evc-cell .v{font-size:12px;color:var(--text);font-weight:600;margin-top:1px}
.evc-cell .sub{font-size:9.5px;color:var(--research-muted)}
/* verdict anchors — the three states the operator reads first */
.evc-grid.anchors{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin-bottom:8px}
.evc-grid.anchors .v{font-size:14.5px}
.evc-grid.details .v{font-size:11px;font-weight:500}
/* Level-5 Research System Trust panel */
.trust-panel{border:1px solid var(--research-border);border-radius:8px;padding:8px 14px;margin-bottom:12px;background:var(--research-surface)}
.trust-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.trust-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:4px 16px;font-size:10.5px;color:var(--research-muted)}
.trust-row b{color:var(--text)}
.trust-TRUSTED{color:var(--research-emerald)} .trust-PARTIAL{color:var(--research-steel)}
.trust-DEGRADED{color:var(--research-amber)} .trust-BLOCKED{color:var(--research-red)}
.fit-line{font-size:9.5px;color:var(--research-muted);margin:1px 0 0 16px}
/* ── Research System Status strip: one overall state + at most six primary
   values; every lower-level diagnostic lives in the expandable drawer ── */
.status-strip{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.status-strip .overall{display:inline-flex;gap:7px;align-items:center;font-size:11.5px;font-weight:700;padding:3px 12px;border-radius:14px;border:1px solid var(--border);background:transparent;cursor:help}
.status-strip .overall .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.status-strip .overall.ready{color:var(--sev-good);border-color:rgba(63,174,130,.45)} .status-strip .overall.ready .dot{background:var(--sev-good)}
.status-strip .overall.degraded{color:var(--sev-degraded);border-color:rgba(217,161,63,.5)} .status-strip .overall.degraded .dot{background:var(--sev-degraded)}
.status-strip .overall.blocked{color:var(--sev-critical);border-color:rgba(209,96,96,.55)} .status-strip .overall.blocked .dot{background:var(--sev-critical)}
.status-strip .sitem{display:inline-flex;gap:6px;align-items:baseline;font-size:11px}
.status-strip .sitem .sl{font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--research-muted)}
.status-strip .sitem .sv{color:var(--text);font-weight:600}
.status-strip .spacer{flex:1}
.mode-btn{background:var(--panel2);border:1px solid var(--border);color:var(--dim);border-radius:4px;font:inherit;font-size:10px;padding:2px 10px;cursor:pointer}
.mode-btn:hover{color:var(--text)} .mode-btn.on{color:var(--accent);border-color:var(--accent)}
details.diag-drawer{margin-top:5px}
details.diag-drawer>summary{cursor:pointer;font-size:10px;color:var(--research-muted);user-select:none}
details.diag-drawer>summary:hover{color:var(--text)}
details.diag-drawer .status-grid{margin-top:6px}
/* diagnostic status-pill grid (drawer) — one scannable pill per metric */
.status-grid{display:flex;flex-wrap:wrap;gap:5px;align-items:stretch}
.stat-pill{display:inline-flex;flex-direction:column;gap:1px;background:rgba(17,21,31,.6);border:1px solid var(--research-border);border-radius:5px;padding:3px 9px;line-height:1.25}
.stat-pill .sl{font-size:8px;letter-spacing:.7px;text-transform:uppercase;color:var(--research-muted)}
.stat-pill .sv{font-size:11px;font-weight:600;color:var(--text);display:flex;gap:4px;align-items:center}
.stat-pill.warn{border-color:rgba(217,161,63,.45)} .stat-pill.warn .sv{color:var(--amber)}
.stat-pill.bad{border-color:rgba(239,68,68,.5)} .stat-pill.bad .sv{color:var(--neg)}
.stat-pill.ok .sv{color:var(--pos)} .stat-pill.info .sv{color:var(--accent)}
.status-grid .grp-label{align-self:center;font-size:8px;text-transform:uppercase;letter-spacing:1px;color:var(--research-muted);padding-right:2px}
/* Did Not Qualify — fixed-width category column + muted inline symbol tags */
.rej-table{display:grid;grid-template-columns:180px 1fr;gap:5px 12px;margin-top:6px;font-size:10.5px}
.rej-table .rc{color:var(--research-muted);font-weight:600;padding-top:2px}
.rej-table .rc .cnt{color:var(--text);opacity:.7;font-weight:400}
.rej-table .rsyms{display:flex;flex-wrap:wrap;gap:3px}
.sym-tag{display:inline-block;font-size:9.5px;padding:0 6px;border-radius:3px;background:var(--research-surface-elevated);border:1px solid var(--research-border);color:var(--research-muted)}
.sym-tag:hover{color:var(--text)}
/* triggered-state alert banner (context tension / regime invalidation) */
.alert{display:flex;gap:8px;align-items:flex-start;border-radius:6px;padding:7px 12px;margin:0 0 10px;font-size:11px}
.alert .ai{font-size:13px;line-height:1}
.alert .at{font-weight:700;text-transform:uppercase;letter-spacing:.5px;font-size:9.5px;margin-bottom:2px}
.alert.tension-alert{background:var(--amber-bg);border:1px solid rgba(217,161,63,.5);color:var(--amber)}
.alert.invalidation-alert{background:var(--neg-bg);border:1px solid rgba(239,68,68,.55);color:var(--neg)}
.alert .abody{color:var(--text)}
/* Open vs Matured summary strip (Forward Evidence header) */
.om-strip{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.om-pill{background:var(--research-surface);border:1px solid var(--research-border);border-radius:6px;padding:5px 12px;font-size:10.5px;color:var(--research-muted)}
.om-pill b{color:var(--text);font-size:13px;margin-right:3px}
.om-pill.matured b{color:var(--research-emerald)} .om-pill.open b{color:var(--research-steel)}
/* ── deterministic plain-English interpretation line (one per panel) ── */
.interp{margin-top:8px;font-size:11px;color:var(--text);border-top:1px solid rgba(35,42,59,.6);padding-top:6px;line-height:1.5}
.interp::before{content:"» ";color:var(--research-muted)}
/* ── snapshot row: Market Context · Evidence & Confidence · System Trust ── */
.snap-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:14px}
.snap-row .mkt-strip,.snap-row .evc-panel,.snap-row .trust-panel{margin-bottom:0}
/* ── Research Caveats drawer: collapsed count line by default; grouped,
   severity-differentiated explanations on expand ── */
.caveats{border:1px solid var(--border);border-radius:8px;background:var(--panel);margin-bottom:14px}
.caveats>summary{cursor:pointer;padding:7px 14px;font-size:11px;color:var(--research-muted);user-select:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.caveats>summary:hover{color:var(--text)}
.caveats>summary .cv-count{color:var(--sev-caveat);font-weight:700}
.caveats>summary .dw-count{color:var(--sev-degraded);font-weight:700}
.caveats>summary .ov-count{color:var(--sev-info);font-weight:700}
.cv-group.overlay .cv-title{color:var(--sev-info)}
.cv-group.overlay .cv-item{border-left-color:rgba(123,132,150,.5)}
.caveats .cv-body{padding:4px 14px 10px}
.cv-group{margin:6px 0}
.cv-group .cv-title{font-size:10px;font-weight:700;letter-spacing:.5px;margin-bottom:2px}
.cv-group.caveat .cv-title{color:var(--sev-caveat)}
.cv-group.data .cv-title{color:var(--sev-degraded)}
.cv-group .cv-item{font-size:10.5px;color:var(--research-muted);padding:2px 0 2px 10px;border-left:2px solid var(--border);margin:2px 0;line-height:1.5}
.cv-group.caveat .cv-item{border-left-color:rgba(127,149,181,.45)}
.cv-group.data .cv-item{border-left-color:rgba(217,161,63,.45)}
/* market-fit badge — shown only when aligned or conflicted (never neutral) */
.fit-bdg{display:inline-block;padding:0 7px;border-radius:8px;font-size:9px;font-weight:700;border:1px solid;white-space:nowrap}
.fit-bdg.aligned{color:var(--sev-good);border-color:rgba(63,174,130,.45);background:var(--sev-good-bg)}
.fit-bdg.conflict{color:var(--sev-degraded);border-color:rgba(217,161,63,.45);background:var(--sev-degraded-bg)}
/* Executive Research Summary (Level 1) */
.exec-summary{border:1px solid var(--border);border-left:3px solid var(--emerald);border-radius:8px;padding:12px 16px;margin-bottom:14px;background:var(--panel)}
.exec-summary.deg{border-left-color:var(--amber)}
.exec-summary.blk{border-left-color:var(--neg)}
.exec-summary h2{margin:0 0 8px;font-size:13px;color:var(--text);letter-spacing:.5px}
.exec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 18px;font-size:11.5px}
.exec-grid .k{color:var(--dim)} .exec-grid .v{color:var(--text);font-weight:600}
/* top candidates get real prominence — chips, not inline text */
.exec-top{margin-top:10px;font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.exec-top .lbl{color:var(--dim)}
.exec-top .tk{color:var(--emerald);font-weight:700;font-size:14px;letter-spacing:.4px;padding:2px 11px;border:1px solid rgba(63,174,130,.4);border-radius:5px;background:var(--sev-good-bg)}
.exec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.exec-head h2{margin:0}
/* segmented Focus / Full mode toggle — the primary view control */
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.seg button{background:var(--panel2);border:none;color:var(--dim);font:inherit;font-size:10.5px;padding:4px 14px;cursor:pointer}
.seg button.on{color:var(--text);background:rgba(90,162,255,.15);font-weight:700}
.seg button:hover{color:var(--text)}
/* section header shared */
.sec-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 6px}
.sec-head h2{margin:0;font-size:14px;letter-spacing:.4px}
.sec-head .meta{font-size:10.5px;color:var(--dim)}
.sec-ctrls{margin:4px 0 8px;display:flex;gap:6px;flex-wrap:wrap}
.sec-ctrls button{background:var(--panel2);border:1px solid var(--border);color:var(--dim);border-radius:4px;font:inherit;font-size:10px;padding:2px 8px;cursor:pointer}
.sec-ctrls button.on{color:var(--text)} .sec-ctrls button:hover{color:var(--text)}
/* High-Conviction Alpha (Level 2) — deep emerald, premium */
.hc-wrap{border:1px solid var(--emerald-dim);border-top:2px solid var(--emerald);border-radius:8px;padding:12px 16px;margin-bottom:14px;background:var(--emerald-bg)}
.hc-wrap .sec-head h2{color:var(--emerald)}
/* 3 cards/row desktop · 2 laptop · 1 mobile — readable width, roomier padding */
.hc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:1500px){.hc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.hc-grid{grid-template-columns:1fr}}
.hc-card{border:1px solid var(--border);border-radius:6px;padding:12px 15px;background:var(--panel);max-width:560px}
.hc-card .hdr{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;justify-content:space-between}
.hc-card .idn{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.hc-card .rank{color:var(--dim);font-size:11px} .hc-card .tk{color:var(--emerald);font-weight:700;font-size:19px;letter-spacing:.3px}
.hc-card .sc{font-weight:700;color:var(--text);font-size:19px}
.hc-card .sub{font-size:10.5px;color:var(--dim);margin:3px 0 7px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
/* classification badge — clean tier chip, title case, tier-toned */
.cls-bdg{display:inline-block;padding:1px 9px;border-radius:9px;font-size:9.5px;font-weight:700;letter-spacing:.4px;border:1px solid;white-space:nowrap}
.cls-bdg.hc{color:var(--sev-good);border-color:rgba(63,174,130,.5);background:var(--sev-good-bg)}
.cls-bdg.pr{color:var(--sev-caveat);border-color:rgba(127,149,181,.5);background:var(--sev-caveat-bg)}
.cls-bdg.wf{color:var(--dim);border-color:var(--border);background:var(--gray-bg)}
.sr-block{margin:4px 0 0}
.sr-block .lab{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin:5px 0 2px}
.sr-list{list-style:none;margin:0;padding:0;font-size:11px}
.sr-list li{padding:1px 0}
.sr-str li::before{content:"✓ ";color:var(--emerald)}
.sr-risk li::before{content:"• ";color:var(--amber)}
/* factor score bars (in expanded details) */
.fbars{margin:4px 0}
.fbar{display:grid;grid-template-columns:130px 1fr 30px;gap:8px;align-items:center;font-size:10.5px;padding:1px 0}
.fbar .fn{color:var(--dim)} .fbar .fv{text-align:right;color:var(--text)}
.fbar .track{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.fbar .fill{height:100%;background:var(--emerald);border-radius:3px}
/* Business-Deterioration risk badge — restrained, never system-error styling */
.det{display:inline-block;padding:1px 8px;border-radius:9px;font-size:9.5px;font-weight:700;border:1px solid;white-space:nowrap}
.det-low{color:var(--steel);border-color:rgba(139,150,168,.55);background:rgba(139,150,168,.08)}
.det-medium{color:var(--amber);border-color:rgba(217,161,63,.45);background:rgba(217,161,63,.08)}
.det-high{color:var(--neg);border-color:rgba(239,68,68,.45);background:rgba(239,68,68,.08)}
.det-unknown{color:var(--dim);border-color:var(--border);background:var(--gray-bg)}
/* Emerging Opportunities (Level 2) — muted indigo/teal, exploratory */
.eo-wrap{border:1px solid var(--indigo);border-radius:8px;padding:12px 16px;margin-bottom:14px;background:var(--indigo-bg)}
.eo-wrap .sec-head h2{color:var(--indigo)}
.eo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.eo-card{border:1px solid var(--border);border-radius:6px;padding:9px 12px;background:var(--panel);font-size:11px}
.eo-card .tk{color:var(--indigo);font-weight:700;font-size:14px}
.eo-card .rk{color:var(--dim);font-size:11px}
.eo-card .sub{font-size:10px;color:var(--dim);margin:2px 0 5px}
.eo-line{color:var(--dim);font-size:10.5px;margin:2px 0 0}
.eo-line b{color:var(--text)}
.eo-tag{display:inline-block;padding:0 6px;border-radius:8px;font-size:9px;border:1px solid var(--indigo);color:var(--indigo);background:var(--indigo-bg)}
/* Strong Profiles — Wait for Reset (Level 2) — muted violet */
.ext-wrap{border:1px solid var(--violet);border-radius:8px;padding:12px 16px;margin-bottom:14px;background:var(--violet-bg)}
.ext-wrap .sec-head h2{color:var(--violet)}
.ext-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.ext-card{border:1px solid var(--border);border-radius:6px;padding:9px 12px;background:var(--panel);font-size:11px}
.ext-card .tk{color:var(--violet);font-weight:700;font-size:14px}
/* Did Not Qualify tray (collapsed, low emphasis) */
.rej-tray{margin-top:8px;opacity:.85}
.rej-tray summary{cursor:pointer;color:var(--dim);font-size:11px;font-weight:700}
.rej-group summary{cursor:pointer;color:var(--dim);font-size:10.5px;padding:2px 0 2px 10px}
.rej-group .tks{font-size:10px;color:var(--dim);padding:2px 0 4px 20px}
/* compact program summary cards (Level 3) */
.prog-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:14px}
.psum{border:1px solid var(--border);border-radius:6px;padding:10px 14px;background:var(--panel)}
.psum.primary{border-top:2px solid var(--emerald)}
.psum h3{margin:0;font-size:12px;color:var(--text)}
.psum .hold{font-size:10px;color:var(--dim);margin:1px 0 6px}
.psum .stat{font-size:10.5px;color:var(--dim);margin:1px 0}
.psum .stat b{color:var(--text)}
.psum ol{margin:6px 0 6px 0;padding-left:18px;font-size:11px}
.psum ol li{padding:1px 0}
.psum .lnk{font-size:10px;color:var(--accent);cursor:pointer}
.psum .lnk:hover{text-decoration:underline}

/* ── app shell: fixed sidebar ── */
#sidebar{width:var(--sidew);min-width:var(--sidew);background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;transition:width .15s,min-width .15s}
body.side-collapsed #sidebar{width:var(--sidew-c);min-width:var(--sidew-c)}
#side-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px}
#side-head h1{font-size:12px;margin:0;color:var(--accent);letter-spacing:.5px;white-space:nowrap;overflow:hidden}
body.side-collapsed #side-head h1{display:none}
#side-toggle{background:none;border:1px solid var(--border);color:var(--dim);border-radius:4px;cursor:pointer;padding:2px 7px;font:inherit}
#side-toggle:hover{color:var(--text)}
#sidebar .sub{font-size:9px;color:var(--dim);margin:0 12px 10px;white-space:nowrap;overflow:hidden}
body.side-collapsed #sidebar .sub{display:none}
#nav{overflow-y:auto;flex:1}
.nav-group{margin-bottom:4px}
.nav-glabel{font-size:8.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--research-muted);padding:8px 14px 3px;opacity:.75}
body.side-collapsed .nav-glabel{display:none}
#nav a{display:flex;align-items:center;gap:8px;padding:6px 14px;color:var(--dim);text-decoration:none;border-left:2px solid transparent;cursor:pointer;white-space:nowrap}
#nav a.active{color:var(--text);background:rgba(90,162,255,.10);border-left-color:var(--accent);font-weight:700}
#nav a:hover{color:var(--text);background:var(--panel2)}
/* expanded: names only (no initials badge clutter); collapsed: centered
   initials with title tooltips carrying the full page name */
#nav .ini{display:none;width:24px;min-width:24px;text-align:center;font-size:10px;color:var(--accent);background:var(--panel2);border:1px solid var(--border);border-radius:3px;padding:1px 0}
#nav .lbl{overflow:hidden;text-overflow:ellipsis}
body.side-collapsed #nav .ini{display:inline-block}
body.side-collapsed #nav .lbl,body.side-collapsed #nav .ph{display:none}
body.side-collapsed #nav a{justify-content:center;padding:6px 0}
body.side-collapsed #nav a.active .ini{border-color:var(--accent);color:var(--text)}
#nav .ph{font-size:8px;color:var(--dim);margin-left:auto;opacity:.8}
#side-foot{padding:8px 12px;font-size:8.5px;color:var(--dim);opacity:.65;border-top:1px solid var(--border);white-space:normal}
#srv-meta{opacity:.65}
body.side-collapsed #side-foot{display:none}

/* ── main column: fixed header + tabs + scrolling workspace ── */
#main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh}
#gheader{padding:7px 12px 6px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0}
#gheader .hrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
#gheader .hrow.data{margin-top:4px}
#gheader .hrow.data .chip{font-size:9.5px;padding:1px 6px}
#gheader .grp{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-right:2px}
.chip{padding:2px 8px;border-radius:4px;background:var(--panel2);border:1px solid var(--border);font-size:10.5px;white-space:nowrap;color:var(--dim)}
.chip b{color:var(--text)}
.chip.ok b{color:var(--pos)} .chip.bad b{color:var(--neg)} .chip.warn b{color:var(--amber)} .chip.info b{color:var(--accent)}

/* ── status badge system: one consistent pill per status value ──
   green = healthy · amber = caution / intentional safety gate (Phase 4B
   BLOCKED is amber, not red — it is a gate, not a failure) · red = failure
   · gray = missing / immature / pending */
.bdg{display:inline-block;padding:1px 8px;border-radius:9px;font-size:10px;font-weight:700;letter-spacing:.3px;border:1px solid;white-space:nowrap}
.bdg.g{color:var(--sev-good);border-color:rgba(63,174,130,.5);background:var(--sev-good-bg)}
/* degraded-but-usable = muted amber OUTLINE — never a filled orange block */
.bdg.a{color:var(--sev-degraded);border-color:rgba(217,161,63,.55);background:transparent}
.bdg.r{color:var(--sev-critical);border-color:rgba(209,96,96,.5);background:var(--sev-critical-bg)}
.bdg.s{color:var(--sev-caveat);border-color:rgba(127,149,181,.5);background:var(--sev-caveat-bg)}
.bdg.n{color:var(--dim);border-color:var(--border);background:var(--gray-bg)}

#tabbar{display:flex;gap:2px;background:var(--panel);border-bottom:1px solid var(--border);padding:0 8px;flex-shrink:0;overflow-x:auto}
#tabbar .tab{display:flex;align-items:center;gap:6px;padding:5px 10px;font-size:11px;color:var(--dim);cursor:pointer;border:1px solid transparent;border-bottom:none;border-radius:5px 5px 0 0;white-space:nowrap}
#tabbar .tab.active{color:var(--text);background:var(--bg);border-color:var(--border)}
#tabbar .tab .x{color:var(--dim);padding:0 2px} #tabbar .tab .x:hover{color:var(--neg)}

#workspace{flex:1;overflow:auto;padding:12px}

/* ── card system: 1px border, panel background, 14px padding, 12px gaps,
      uppercase muted header, optional top accent for important cards ── */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:14px 16px}
.card.accent{border-top:2px solid var(--accent)}
.card.accent-warn{border-top:2px solid var(--amber)}
.card h3{margin:0 0 10px;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
.card .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:11.5px;align-items:center}
.card .kv .k{color:var(--dim)} .card .kv .v{text-align:right}
.card .big{font-size:20px;font-weight:700;font-family:inherit}
.v.ok{color:var(--pos)} .v.bad{color:var(--neg)} .v.warn{color:var(--amber)} .v.info{color:var(--accent)}
.card.action{cursor:pointer;transition:border-color .12s,transform .12s,box-shadow .12s;outline:none}
.card.action:hover,.card.action:focus-visible{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.35)}
.card.action .go{color:var(--accent);font-size:11px}
/* warnings: amber reserved for the icon + count; body text stays muted */
.warnlist{font-size:11px} .warnlist div{padding:4px 0;border-bottom:1px solid rgba(35,42,59,.5);color:var(--dim)}
.warnlist div:last-child{border-bottom:none}
.warnlist .wi{color:var(--amber);margin-right:6px}
.note{margin-top:8px;padding:6px 8px;background:var(--panel2);border:1px solid var(--border);border-radius:4px;font-size:10.5px;color:var(--dim);line-height:1.5}

/* ── leaderboard ── */
#board-toolbar{display:flex;gap:12px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
#filter{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font:inherit;width:190px}
#board-toolbar .sum{color:var(--dim);font-size:11px}
#board-toolbar .key{color:var(--dim);font-size:10px;margin-left:auto}
/* natural column widths + horizontal scroll via the workspace container —
   prevents right-side columns (Category etc.) being crushed; sticky header
   keeps working because #workspace remains the scroll container */
table{border-collapse:collapse;width:max-content;min-width:100%;font-size:11.5px}
th,td{min-width:0} th{min-width:46px}
th{position:sticky;top:0;z-index:5;background:var(--panel);color:var(--dim);text-align:left;padding:5px 7px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--text)} th.sorted{color:var(--accent)}
th .arr{font-size:9px;color:var(--accent)}
td{padding:3px 7px;border-bottom:1px solid rgba(35,42,59,.45);white-space:nowrap}
tr.row{cursor:pointer} tr.row:hover{background:var(--panel2)}
tr.row.sel{background:rgba(90,162,255,.10);outline:1px solid rgba(90,162,255,.35)}
td.tick{color:var(--accent);font-weight:700}
td.co{max-width:180px;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
.cell{display:inline-block;min-width:50px;text-align:right;padding:0 5px;border-radius:3px}
.pos{color:var(--pos);background:var(--pos-bg)} .neg{color:var(--neg);background:var(--neg-bg)}
.miss{color:var(--dim);background:var(--gray-bg)} .amber{color:var(--amber);background:var(--amber-bg)}
.tag{padding:1px 6px;border-radius:3px;font-size:10px;background:var(--panel2);border:1px solid var(--border);color:var(--dim)}
.tag.q{color:var(--amber);border-color:var(--amber)}
.tag.hp{color:var(--pos);border-color:var(--pos)}
/* row warning icon: quiet until the row is hovered or selected */
.wico{font-size:9px;color:var(--amber);opacity:.45;cursor:help}
tr.row:hover .wico,tr.row.sel .wico{opacity:1}

/* ── drawer ── */
#drawer{position:fixed;top:0;right:-480px;width:460px;height:100vh;background:var(--panel);border-left:1px solid var(--border);transition:right .18s ease;z-index:30;display:flex;flex-direction:column}
#drawer.open{right:0}
#d-head{padding:12px 16px;border-bottom:1px solid var(--border)}
#d-head .top{display:flex;justify-content:space-between;align-items:center}
#d-head h2{margin:0;font-size:15px;color:var(--accent)}
#d-head .co{color:var(--dim);font-size:11px;margin:2px 0 6px}
#d-head .chips{display:flex;gap:5px;flex-wrap:wrap}
#d-head button{background:none;border:1px solid var(--border);color:var(--dim);border-radius:4px;cursor:pointer;padding:2px 9px;font:inherit}
#drawer .body{padding:10px 16px;overflow-y:auto;flex:1}
#drawer .sect{margin-bottom:12px;background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:8px 10px}
#drawer .sect h3{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin:0 0 6px}
#drawer .kv{display:grid;grid-template-columns:128px 1fr;gap:2px 10px;font-size:11.5px}
#drawer .kv .k{color:var(--dim)} #drawer .kv .v{color:var(--text);word-break:break-word}
#drawer footer{padding:9px 16px;border-top:1px solid var(--border);font-size:10px;color:var(--amber)}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none}
#overlay.open{display:block}

/* charts */
.chart{margin:6px 0 10px} .chart .ttl{font-size:10px;color:var(--dim);margin-bottom:2px;display:flex;justify-content:space-between}
.chart svg{display:block;background:var(--bg);border:1px solid var(--border);border-radius:4px}
.legend{font-size:9px;color:var(--dim);margin-top:2px}
.legend i{display:inline-block;width:8px;height:2px;vertical-align:middle;margin:0 3px 0 8px}

/* placeholders — professional empty-state cards */
.stub{max-width:520px;margin:64px auto;text-align:center;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:36px 32px}
.stub h2{color:var(--text);margin:0 0 10px;font-size:14px;letter-spacing:.4px}
.stub p{color:var(--dim);margin:0 0 16px;font-size:12px;line-height:1.6}
.banner{background:var(--amber-bg);border:1px solid var(--amber);color:var(--amber);padding:6px 12px;border-radius:4px;font-size:11px;margin-bottom:10px}
h2.pg{font-size:13px;margin:0 0 10px;color:var(--text)}
</style>
</head>
<body>

<aside id="sidebar">
  <div id="side-head">
    <h1>RESEARCH TERMINAL</h1>
    <button id="side-toggle" title="collapse / expand sidebar">⟨⟩</button>
  </div>
  <p class="sub">RESEARCH ONLY · cache-only · read-only</p>
  <nav id="nav"></nav>
  <div id="srv-meta" class="sub"></div>
  <div id="side-foot">Research only — not a signal or recommendation.</div>
</aside>

<div id="main">
  <div id="gheader"></div>
  <div id="tabbar"></div>
  <div id="workspace"></div>
</div>

<div id="overlay" onclick="closeDrawer()"></div>
<div id="drawer">
  <div id="d-head"></div>
  <div class="body" id="d-body"></div>
  <footer id="d-footer">Research only — not a signal or recommendation.</footer>
</div>

<script>
"use strict";
/* Research Terminal shell — Phase 2.5.
   RESEARCH_ONLY: renders cached research artifacts only.
   GET-only client; nothing here can mutate anything. */

/* Sidebar routes grouped into logical sections (only real routes; no
   duplicates).  `group` drives the section labels in renderNav. */
const NAV = [
  {id:"home",       label:"Command Center",       ini:"HM", group:"Research"},
  {id:"alpha",      label:"Alpha Radar",          ini:"AR", group:"Discovery"},
  {id:"board",      label:"Scanner Leaderboard",  ini:"SL", group:"Discovery"},
  {id:"forward-evidence", label:"Forward Evidence", ini:"FE", group:"Evidence"},
  {id:"sector-compass",   label:"Sector / Regime",  ini:"SC", group:"Discovery"},
  {id:"social-arb",       label:"Social Attention", ini:"SA", group:"Discovery"},
  {id:"fundamental-lens", label:"Fundamental Overlay", ini:"FL", group:"Quality & Risk"},
  {id:"universe",   label:"Universe Health",      ini:"UH", group:"Quality & Risk"},
  {id:"data-quality",     label:"Data Quality",    ini:"DQ", group:"Quality & Risk"},
  {id:"hp",         label:"High Priority Review", ini:"HP", group:"Research"},
  {id:"extended",   label:"Wait for Reset",       ini:"EX", group:"Research"},
  {id:"young",      label:"Young Listings",       ini:"YL", group:"Quality & Risk"},
  {id:"mot",        label:"Moment of Truth",      ini:"MT", group:"Evidence"},
  {id:"research-journal", label:"Research Journal", ini:"RJ", group:"Operations"},
];
/* section render order for the grouped sidebar */
const NAV_GROUPS=["Research","Evidence","Discovery","Quality & Risk","Operations"];

let BOARD=null, STATUS=null;
let sortKey="research_score", sortDir=-1, filterText="", selectedTicker=null;
let activePage="home";
let openTabs=["home"];           // workspace tab row — local UI state only
/* presentation-only view state (persisted in localStorage; artifacts,
   scores, and rankings are never touched by any of it) */
let DIAG_OPEN=false;             // diagnostics drawer open/closed (session)
let UIVIEW=(()=>{ try{ return Object.assign({focus:false},
  JSON.parse(localStorage.getItem("rcc_view")||"{}")); }catch(e){ return {focus:false}; } })();
function persistView(){ try{ localStorage.setItem("rcc_view",JSON.stringify(UIVIEW)); }catch(e){} }

const $=s=>document.querySelector(s);
const fmt=(v,d=2)=>(v===null||v===undefined||Number.isNaN(v))?"—":Number(v).toFixed(d);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const navLabel=id=>(NAV.find(n=>n.id===id)||{}).label||id;
/* Sidecar generated_at values are UTC ISO strings; operators think in ET
   (research cycle runs on ET timers), so render wall-clock ET.
   Some producers write NAIVE timestamps (no Z / ±hh:mm) — JS parses those
   as browser-local, which skewed the displayed time by the viewer's UTC
   offset.  All producers write UTC, so force naive strings to UTC. */
const fmtET=ts=>{
  if(!ts)return "—";
  let s=String(ts);
  if(/T\d\d:\d\d/.test(s)&&!/(Z|[+-]\d\d:?\d\d)$/.test(s)) s+="Z";
  const d=new Date(s);
  if(Number.isNaN(d.getTime()))return String(ts).slice(0,19);
  return d.toLocaleString("sv-SE",{timeZone:"America/New_York"})+" ET";
};

function heat(v){
  if(v===null||v===undefined) return `<span class="cell miss">—</span>`;
  const cls=v>0?"pos":v<0?"neg":"miss";
  return `<span class="cell ${cls}">${v>0?"+":""}${Number(v).toFixed(1)}%</span>`;
}

/* ── status badge system (severity-differentiated) ──
   green = healthy · amber = system/data integrity degraded, or an
   intentional safety gate (Phase 4B BLOCKED is a gate, not a failure →
   amber) · steel-blue = research-evidence caveat (unvalidated / immature /
   inconclusive — a research state, not a system problem) · red = failure ·
   gray = missing / pending. Unknown values default to gray. */
const BADGE_GREEN=["PASS","READY","FRESH","RESEARCH_ONLY","OK","UNBLOCKED","PROMISING","SAME-SESSION"];
const BADGE_AMBER=["BLOCKED","STALE","SUSPECT","DATA_QUARANTINE","WARN","QUARANTINE",
  "STALE_PRICE","BENCHMARK_MISSING","SUSPECT_FEED","CONFLICTED",
  "DEGRADED","SESSION_MISMATCH","UNGATED","UNAVAILABLE_STALE_SOURCE"];
const BADGE_CAVEAT=["NEED_MORE_DATA","INCONCLUSIVE","MIXED","PARTIAL",
  "IMMATURE_FORWARD_EVIDENCE","INSUFFICIENT_HISTORY","TOO_EARLY",
  "EARLY_SIGNAL","NO_FORWARD_EDGE","INSUFFICIENT_MATURE_EVIDENCE"];
const BADGE_RED=["FAIL","MISSING","ERROR"];
function badgeClass(v){
  const u=String(v??"").toUpperCase();
  if(BADGE_GREEN.includes(u))return "g";
  if(BADGE_AMBER.includes(u))return "a";
  if(BADGE_CAVEAT.includes(u))return "s";
  if(BADGE_RED.includes(u))return "r";
  return "n";  // NO_DATA, MISSING_ARTIFACT, TODO, unknown
}
function badge(v){
  if(v===null||v===undefined||v==="")return `<span class="bdg n">—</span>`;
  return `<span class="bdg ${badgeClass(v)}">${esc(v)}</span>`;
}

/* ══ shared institutional-terminal components (one design language across
   every sidebar tab).  Presentation only — canonical values preserved. ══ */
/* canonical enum → clean display label (never mutates the payload) */
const TERM_LABELS={
  NEED_MORE_DATA:"Forward Validation: In Progress",
  INCONCLUSIVE:"Inconclusive",
  MIXED:"Mixed",
  INSUFFICIENT_MATURE_EVIDENCE:"Insufficient Evidence",
  PROMISING_BUT_UNPROVEN:"Promising, Unproven",
  VALIDATED_EDGE:"Validated Edge",
  NO_EVIDENCE_OF_EDGE:"No Evidence of Edge",
  NO_FORWARD_EDGE:"No Forward Edge Detected",
  QUALITY_BUT_EXTENDED:"Strong Profile — Wait for Reset",
  REJECTED:"Did Not Qualify",
  DATA_QUARANTINE:"Data Issue / Quarantined",
  UNAVAILABLE_STALE_SOURCE:"Unavailable — Stale Source",
  SHORTLIST_IMPROVES_OUTCOMES:"Shortlist Improves Outcomes",
  NO_IMPROVEMENT_OVER_PROGRAM_CANDIDATES:"No Improvement vs Program",
};
const termLabel=v=>TERM_LABELS[v]||(v?esc(String(v)):"—");
/* a consistent Level-1 page header for every tab */
function pageHeader(title,subtitle,opts){
  opts=opts||{};
  const meta=[];
  if(opts.generated_at) meta.push(freshnessChip(opts.generated_at,opts.ageHours));
  if(opts.integrity) meta.push(`<span class="freshness-chip">Scan Integrity: ${esc(cap1(opts.integrity))}</span>`);
  if(opts.badges) meta.push(opts.badges);
  return `<header class="page-header">
    <h2 class="pt">${esc(title)}</h2>
    ${subtitle?`<div class="psubt">${esc(subtitle)}</div>`:""}
    ${meta.length?`<div class="pmeta">${meta.join("")}</div>`:""}
  </header>`;
}
function freshnessChip(ts,ageHours){
  const stale=(typeof ageHours==="number")&&ageHours>24;
  const cls=stale?"stale":(ageHours!=null?"fresh":"");
  return `<span class="freshness-chip ${cls}">Updated ${esc(fmtET(ts))}</span>`;
}
function researchOnlyDisclosure(msg){
  return `<div class="ro-disclosure">${esc(msg||"All content is research-only. Forward evidence is unvalidated unless otherwise stated. Nothing here is a trade signal.")}</div>`;
}
function emptyState(title,msg){
  return `<div class="empty-state"><h3>${esc(title)}</h3><p>${esc(msg||"")}</p></div>`;
}
/* distinct visual states — never one generic red banner */
function stateBanner(kind,msg){
  return `<div class="state ${esc(kind)}">${esc(msg)}</div>`;
}

/* ── sidebar + tabs (app shell) ── */
function navLink(n){
  return `<a data-id="${n.id}" class="${n.id===activePage?"active":""}" title="${n.label}"
     tabindex="0" role="link" aria-current="${n.id===activePage?"page":"false"}">
     <span class="ini">${n.ini}</span><span class="lbl">${n.label}</span>
     ${n.stub?`<span class="ph">P${n.stub}</span>`:""}</a>`;
}
function renderNav(){
  const html=NAV_GROUPS.map(g=>{
    const items=NAV.filter(n=>(n.group||"Research")===g);
    if(!items.length) return "";
    return `<div class="nav-group"><div class="nav-glabel">${esc(g)}</div>`
      +items.map(navLink).join("")+`</div>`;
  }).join("");
  // any route without a known group still renders (never hide a real route)
  const ungrouped=NAV.filter(n=>!NAV_GROUPS.includes(n.group||"Research"));
  $("#nav").innerHTML = html
    +(ungrouped.length?`<div class="nav-group"><div class="nav-glabel">More</div>`
      +ungrouped.map(navLink).join("")+`</div>`:"");
  document.querySelectorAll("#nav a").forEach(a=>{
    a.onclick=()=>openPage(a.dataset.id);
    a.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openPage(a.dataset.id);}};
  });
}
function renderTabs(){
  $("#tabbar").innerHTML = openTabs.map(id=>
    `<span class="tab ${id===activePage?"active":""}" data-id="${id}">${navLabel(id)}
       ${openTabs.length>1?`<span class="x" data-x="${id}" title="close tab">✕</span>`:""}</span>`).join("");
  document.querySelectorAll("#tabbar .tab").forEach(t=>t.onclick=e=>{
    if(e.target.dataset.x){ closeTab(e.target.dataset.x); return; }
    activePage=t.dataset.id; renderNav(); renderTabs(); renderPage();
  });
}
const MAX_TABS=6;   // cap the tab row — oldest non-active tab is evicted
function openPage(id){
  activePage=id;
  if(!openTabs.includes(id)) openTabs.push(id);
  while(openTabs.length>MAX_TABS){
    const evict=openTabs.find(t=>t!==activePage);
    if(!evict)break;
    openTabs=openTabs.filter(t=>t!==evict);
  }
  renderNav(); renderTabs(); renderPage();
}
function closeTab(id){
  openTabs=openTabs.filter(t=>t!==id);
  if(!openTabs.length) openTabs=["home"];
  if(activePage===id) activePage=openTabs[openTabs.length-1];
  renderNav(); renderTabs(); renderPage();
}
$("#side-toggle").onclick=()=>document.body.classList.toggle("side-collapsed");

/* ── global header (persistent) — status values render as badges ── */
function chip(label,value,cls){return `<span class="chip ${cls||""}">${label}: <b>${esc(value)}</b></span>`;}
/* diagnostic status pill — one label/value container per tracked metric.
   `cls` = ""|"ok"|"warn"|"bad"|"info"; `raw` renders value HTML as-is. */
function statPill(label,value,cls,raw){
  const v=raw?value:esc(value==null?"—":value);
  return `<span class="stat-pill ${cls||""}"><span class="sl">${esc(label)}</span>
    <span class="sv">${v}</span></span>`;
}
/* Overall research-system state — deterministic from scan integrity + trust.
   BLOCKED > DEGRADED > READY.  Presentation only.  "Usable with caveats"
   instead of a shouted DEGRADED: the system still works; the caveats say why.
   The canonical readiness values stay visible in the tooltip + drawer. */
function overallSystemState(s){
  const si=(s||{}).scan_integrity||{};
  const vals=[String(si.readiness||"").toUpperCase(),
              String(((s||{}).system_trust||{}).overall||"").toUpperCase()];
  const bits=[];
  if(si.readiness) bits.push("scan integrity "+String(si.readiness).toLowerCase());
  if(si.universe_coverage_pct!=null) bits.push(si.universe_coverage_pct+"% universe coverage");
  const ex=Object.values((si.manifest||{}).excluded_by_reason||{}).reduce((a,b)=>a+(b||0),0);
  if(ex>0) bits.push(ex+" exclusions");
  const detail=bits.join(" · ")||"no integrity detail";
  if(vals.includes("BLOCKED"))return {cls:"blocked",label:"System Trust: Blocked",detail};
  if(vals.includes("DEGRADED"))return {cls:"degraded",label:"System Trust: Usable with caveats",detail};
  return {cls:"ready",label:"System Trust: Ready",detail};
}
/* Research System Status strip — one overall state + six primary values.
   Everything below that severity lives in the expandable diagnostics
   drawer: nothing is removed, only default visual weight is reduced. */
function renderHeader(){
  const s=STATUS||{}, p4=s.phase_4b||{}, si=s.scan_integrity||{};
  const fwd=((s.high_conviction||{}).forward_validation||{});
  const ov=overallSystemState(s);
  const item=(l,v,raw)=>`<span class="sitem"><span class="sl">${esc(l)}</span>
    <span class="sv">${raw?v:esc(v==null?"—":v)}</span></span>`;
  const primary=[
    item("Mode", s.mode||"RESEARCH_ONLY"),
    item("Research state", badge(s.operating_verdict??"?"),true),
    item("Scan integrity", badge(si.readiness??"?"),true),
    item("Benchmarks", badge(s.benchmark_readiness??"?"),true),
    item("Regime", s.market_regime??"?"),
    item("Forward validation", badge(fwd.verdict||s.tracker_verdict||"?"),true),
  ];
  // Diagnostics drawer — full detail, one click away, never deleted.
  const diag=[
    statPill("Nightly", badge(s.nightly_status??"?"),null,true),
    statPill("Phase 4B", badge(p4.status??"?"),null,true),
    statPill("Tracker verdict", badge(s.tracker_verdict??"?"),null,true),
    statPill("Matured 5d", s.matured_5d??"—"),
    statPill("Matured 10d", s.matured_10d??"—"),
    statPill("Total tracked", s.total_tracked??"—"),
    statPill("Freshness", badge(s.data_freshness??"?"),null,true),
    statPill("Session", si.required_market_session??"?", si.benchmarks_aligned===false?"warn":"info"),
    statPill("Stale skipped", s.stale_skipped??"—",(s.stale_skipped||0)>0?"warn":""),
    statPill("Suspect skipped", s.suspect_skipped??"—",(s.suspect_skipped||0)>0?"warn":""),
    statPill("Quarantine", s.quarantine_count??"—",(s.quarantine_count||0)>0?"warn":""),
  ];
  if((si.session_mismatch_excluded||0)>0)
    diag.push(statPill("Session mismatch", si.session_mismatch_excluded,"warn"));
  if((s.missing_artifacts||[]).length)
    diag.push(statPill("Missing artifacts", s.missing_artifacts.join(", "),"bad"));
  const nWarn=(s.warnings||[]).length;
  $("#gheader").innerHTML=
    `<div class="status-strip">
       <span class="overall ${ov.cls}" title="${esc(ov.detail)}"><span class="dot"></span>${esc(ov.label)}</span>
       ${primary.join("")}
       <span class="spacer"></span>
       <button id="focus-toggle" class="mode-btn ${UIVIEW.focus?"on":""}"
         title="Focus mode: only the priority research content">${UIVIEW.focus?"Focus mode ✓":"Focus mode"}</button>
     </div>
     <details class="diag-drawer" ${DIAG_OPEN?"open":""}><summary>Diagnostics — nightly, maturity, data hygiene (${diag.length} items${nWarn?`, ${nWarn} warnings`:""})</summary>
       <div class="status-grid">${diag.join("")}</div>
     </details>`;
  const fbtn=$("#focus-toggle");
  if(fbtn)fbtn.onclick=()=>{UIVIEW.focus=!UIVIEW.focus;persistView();renderHeader();if(activePage==="home")renderHome();};
  const dd=document.querySelector("#gheader details.diag-drawer");
  if(dd)dd.ontoggle=()=>{DIAG_OPEN=dd.open;};
}

/* ── Research Home ── */
function card(title,body,cls){return `<div class="card ${cls||""}">${title?`<h3>${title}</h3>`:""}${body}</div>`;}
function kvRow(k,v,cls){return `<div class="k">${k}</div><div class="v ${cls||""}">${v??"—"}</div>`;}
function actionCard(title,desc,page){
  return `<div class="card action" data-page="${page}" tabindex="0" role="button"
    aria-label="open ${title}"><h3>${title}</h3>
    <div style="color:var(--dim);font-size:11px;margin-bottom:6px">${desc}</div>
    <span class="go">open →</span></div>`;
}
/* Journal audit card — reads the cached audit sidecar only (never calls an
   LLM). Research-only: promote_to_signal is always false upstream. */
function journalAuditCard(a){
  if(!a||!a.present)
    return card("Journal audit",
      `<div class="note">No audit yet — runs after the nightly journal digest.</div>`);
  const flaws=(a.top_flaws||[]).map(f=>
    `<div><span class="wi">⚠</span><b>${esc(f.severity||"?")}</b> ${esc(f.area||"other")} — ${esc(f.issue||"")}</div>`
  ).join("")||'<div style="color:var(--dim)">no flaws flagged</div>';
  return card(`Journal audit <span class="bdg ${a.flaw_count?"a":"n"}">${a.flaw_count||0}</span>`,
    `<div class="kv">
      ${kvRow("Engine health",badge(a.engine_health))}
      ${kvRow("Alpha quality",badge(a.alpha_discovery_quality))}
      ${kvRow("Verdict",badge(a.research_verdict))}
      ${kvRow("Source",esc(a.audit_source||"—"))}
    </div>
    <div class="note">${esc(a.one_line_summary||"—")}</div>
    <div class="warnlist">${flaws}</div>`);
}

/* ── research-program presentation (cosmetic layer only) ──
   Everything below renders fields the engine already produced.  Ordering
   comes from the adapter's display split (existing score primary); the
   filters and caps are view state — they never touch artifacts. */
const VERDICT_LABELS={  // mirrors presentation.VERDICT_DISPLAY_LABELS
  INSUFFICIENT_MATURE_EVIDENCE:"Insufficient evidence",
  PROMISING_BUT_UNPROVEN:"Promising, unproven",
  VALIDATED_EDGE:"Validated edge",
  NO_EVIDENCE_OF_EDGE:"No evidence of edge",
};
const verdictLabel=v=>VERDICT_LABELS[v]||v||"—";
let PROGVIEW={};  // pid -> {cap, filter} — presentation state only
function progView(pid){return PROGVIEW[pid]||(PROGVIEW[pid]={cap:5,filter:"all"});}

function candFilter(c,f){
  switch(f){
    case "new":return c.scan_status==="NEW";
    case "returning":return c.scan_status==="RETURNING";
    case "high":return ["HIGH_PRIORITY_RESEARCH","TOP_RESEARCH"].includes(c.priority);
    case "reset":return ["RESET_WATCH","RECLAIM_WATCH"].includes(c.priority);
    case "noext":return c.priority!=="EXTENDED_CROWDED";
    default:return true;
  }
}

function candBadges(c){
  // The scan status (NEW/RETURNING/REPEAT) is rendered once as its own badge
  // by the caller — exclude it here so it never appears twice.
  const status=String(c.scan_status||"").toUpperCase();
  return ((c.display||{}).badges||[])
    .filter(b=>String(b.text||"").toUpperCase()!==status)
    .map(b=>{
      const cls=b.tone==="positive"?"g":b.tone==="caution"?"a":"c";
      const title=b.text.startsWith("+")?` title="${esc(c.routing_reason||"secondary program match")}"`:"";
      return `<span class="bdg ${cls}"${title}>${esc(b.text)}</span>`;
    }).join(" ");
}

function candidateCard(c,pos,hideReason){
  const d=c.display||{};
  const horizons=Object.entries(c.evidence_maturity||{})
    .map(([h,st])=>`${h} ${st}`).join(" · ")||"—";
  const session=c.same_session===true?`<span class="bdg g">same-session</span>`
    :c.same_session===false?`<span class="bdg a">SESSION_MISMATCH</span>`:"—";
  return `<div class="cand-row">
    <div>${pos?`<span class="dim">${pos}.</span> `:""}<b>${esc(c.ticker)}</b>
      ${c.research_score!=null?` <span class="score">Score ${esc(c.research_score)}</span>`:""}
      <span class="bdg n">${esc(c.scan_status)}</span> ${candBadges(c)}
      <span class="dim" style="font-size:10px"> ${esc(c.holding_period||"")} · ${esc(c.label||"")}</span></div>
    ${hideReason?"":`<div class="dim" style="margin:2px 0 0 14px">${esc(d.short_reason||c.detection_reason||"")}</div>`}
    <div class="dim" style="font-size:10px;margin-left:14px">${esc(d.evidence_summary||"Evidence: ?")} · <span title="canonical: ${esc(c.program_verdict||"?")}">${esc(d.verdict_label||verdictLabel(c.program_verdict))}</span></div>
    <details class="cand-det" style="margin-left:14px"><summary>full details</summary>
      <div class="kv">
        ${kvRow("Detection reason",esc(c.detection_reason||"—"))}
        ${kvRow("Hypothesis",esc(c.research_hypothesis||"—"))}
        ${kvRow("Programs",esc(c.program)+((c.secondary_programs||[]).length?" (+ "+esc(c.secondary_programs.join(", "))+")":""))}
        ${kvRow("Routing",esc(c.routing_reason||"—"))}
        ${kvRow("Lifecycle",esc(c.lifecycle_stage||"—"))}
        ${kvRow("Priority",esc(c.priority||"—"))}
        ${kvRow("Confidence",esc(c.confidence||"—")+" · data "+esc(c.data_confidence||"—"))}
        ${kvRow("Quality",esc(c.fundamental_quality||"—"))}
        ${kvRow("Evidence horizons",esc(horizons))}
        ${kvRow("Program verdict",esc(c.program_verdict||"—"))}
        ${kvRow("Bar / benchmark as-of",esc(c.bar_as_of_date||"?")+" / "+esc(c.benchmark_as_of_date||"?")+" · "+session)}
        ${kvRow("Scanned",esc(String(c.source_scan_generated_at||"—").slice(0,16)))}
        ${kvRow("Benchmark set",esc(c.current_benchmark||"—"))}
        ${kvRow("Status",badge("RESEARCH_ONLY"))}
      </div>
    </details>
  </div>`;
}

function programDetails(pid,p,routing,ls){
  // Everything the compact header no longer shows, one click away.
  const labels=Object.entries(routing||{})
    .filter(([,r])=>r.program===pid).map(([l])=>l);
  const matured=(p.matured_horizons_td||[]).map(h=>`${h}d`).join(" ")||"none";
  const gaps=(p.primary_not_collected_td||[]).length
    ?`<div class="note">⚠ primary horizons not collected: ${esc((p.primary_not_collected_td||[]).join(", "))}td</div>`:"";
  const diag=(p.diagnostic_signal&&p.diagnostic_signal!=="NONE")
    ?kvRow("Diagnostic read",badge(p.diagnostic_signal)):"";
  const scanMeta=ls&&ls.present?kvRow("Scan",
    `${esc(String(ls.scan_timestamp||"—").slice(0,16))} · market as-of ${esc(ls.market_as_of_date||"?")} · hash ${ls.manifest_hash_match===true?"match":ls.manifest_hash_match===false?"MISMATCH":"?"}`):"";
  return `<details class="prog-det"><summary>Program details</summary>
    <div class="kv" style="margin-top:5px">
      ${kvRow("Validation (canonical)",badge(p.verdict||"UNKNOWN"))}
      ${kvRow("Episodes",esc(String(p.n_episodes??"—")))}
      ${kvRow("Matured horizons",esc(matured))}
      ${diag}
      ${scanMeta}
    </div>
    ${gaps}
    <div class="note">${esc(p.verdict_reason||"")}</div>
    <div class="note" style="color:var(--dim)">labels: ${esc(labels.join(", ")||"—")}</div>
  </details>`;
}

function candidateList(pid,block){
  const view=progView(pid);
  const cands=block.candidates||[];
  const disp=block.display||{};
  const orderIdx=(disp.top_idx||[]).concat(disp.more_idx||[]);
  // ordered clean candidates (adapter split); fall back to artifact order
  const clean=orderIdx.length?orderIdx.map(i=>cands[i])
    :cands.filter(c=>!((c.display||{}).data_issue));
  const issues=(disp.data_issue_idx||[]).map(i=>cands[i]);
  const filtered=clean.filter(c=>candFilter(c,view.filter));
  const shown=filtered.slice(0,view.cap);
  const hideReason=!!disp.common_reason;
  const rows=shown.length
    ?shown.map((c,i)=>candidateCard(c,i+1,hideReason)).join("")
    :`<div class="note">No candidates match the current view filter.</div>`;
  const commonNote=hideReason
    ?`<div class="dim" style="font-size:10px;margin:2px 0">common detection reason: ${esc(disp.common_reason)}</div>`:"";
  const more=filtered.length-shown.length;
  const controls=`<div class="prog-toolbar">
    <select class="prog-filter" data-pid="${pid}">
      ${[["all","All"],["new","New only"],["returning","Returning only"],
         ["high","High priority"],["reset","Reset watch"],
         ["noext","Exclude extended/crowded"]]
        .map(([v,l])=>`<option value="${v}" ${view.filter===v?"selected":""}>${l}</option>`).join("")}
    </select>
    <button class="prog-cap ${view.cap===5?"on":""}" data-pid="${pid}" data-cap="5">Top 5</button>
    <button class="prog-cap ${view.cap===10?"on":""}" data-pid="${pid}" data-cap="10">Top 10</button>
    <button class="prog-cap ${view.cap>=99999?"on":""}" data-pid="${pid}" data-cap="99999">View all ${cands.length-issues.length}</button>
    ${more>0?`<span class="dim" style="font-size:10px">… ${more} more hidden</span>`:""}
  </div>`;
  const issueRows=issues.length
    ?`<details class="issue-det"><summary>⚠ Data issues — ${issues.length} candidate${issues.length>1?"s":""} (excluded from top list)</summary>
        ${issues.map(c=>candidateCard(c,null,false)).join("")}
      </details>`:"";
  const exited=(block.exited||[]).length
    ?`<details class="issue-det"><summary>Exited since previous scan (${block.exited.length})</summary><span class="dim">${esc(block.exited.map(e=>e.ticker).join(", "))}</span></details>`:"";
  return controls+commonNote+rows+issueRows+exited;
}

function scanIntegrityCard(si){
  // P0 Scan Integrity: separates artifact freshness from market-data session
  // freshness from universe coverage.  Never shows FRESH on recency alone.
  if(!si)return card("Scan integrity",`<div class="note">No scan-integrity data yet — rerun the scanner.</div>`);
  const bs=si.benchmark_session||{};
  const bench=Object.entries(bs).map(([k,v])=>`${k} ${v??"?"}`).join(" · ")||"—";
  const ssc=si.stale_source_consumers||{};
  const legacy=ssc.legacy_universe_snapshot||{};
  const newly=(si.newly_admitted_today||[]);
  return card(`Scan integrity ${badge(si.readiness)}`,`<div class="kv">
    ${kvRow("Market as-of session",si.required_market_session??"—")}
    ${kvRow("Benchmarks",`${bench} ${si.benchmarks_aligned===true?badge("OK"):si.benchmarks_aligned===false?badge("MISMATCH"):""}`)}
    ${kvRow("Same-session coverage",si.same_session_coverage_pct!=null?si.same_session_coverage_pct+"%":"—",(si.session_mismatch_excluded||0)>0?"warn":"")}
    ${kvRow("Session-mismatch excluded",si.session_mismatch_excluded??"—",(si.session_mismatch_excluded||0)>0?"warn":"")}
    ${kvRow("Artifact generated",si.artifact_age_hours!=null?si.artifact_age_hours+"h ago":"—")}
    ${kvRow("Universe manifest",(si.manifest||{}).hash?`<span class="dim">#${esc(si.manifest.hash)}</span> · delta ${si.manifest.delta_refresh_succeeded??"?"}/${si.manifest.delta_refresh_needed??"?"} refreshed · ${si.manifest.aligned_final_universe_count??"?"} aligned`:"— (run scan-universe-manifest)")}
    ${kvRow("Universe coverage",si.universe_coverage_pct!=null?si.universe_coverage_pct+"% of eligible market":"— (run discovery-bootstrap)")}
    ${kvRow("Newly admitted",newly.length?esc(newly.slice(0,8).join(", "))+(newly.length>8?" …":""):"none")}
    ${kvRow("Dead symbols excluded",si.dead_symbol_exclusions??"—")}
    ${kvRow("Legacy snapshot",legacy.stale===true?`${badge("UNAVAILABLE_STALE_SOURCE")} <span class="dim">as-of ${esc(legacy.source_as_of||"?")} (${legacy.source_age_sessions??"?"} sessions)</span>`:legacy.stale===false?badge("FRESH"):"—")}
    ${kvRow("FMP budget",esc(String((si.refresh||{}).fmp_budget_status||"—")))}
  </div>`)}

function programSection(pid,p,routing,ls){
  const block=((ls||{}).programs||{})[pid];
  // Compact header: holding period, counts, validation, top evidence,
  // scan-integrity badge.  Everything else lives in "Program details".
  const matured=(p.matured_horizons_td||[]);
  const topEv=matured.length
    ?`Top evidence: ${matured[matured.length-1]}d, n=${p.n_episodes??"?"}`
    :"Top evidence: none matured yet";
  const counts=block
    ?`${block.candidate_count||0} active · ${block.new_count||0} new · ${block.repeat_count||0} repeat · ${block.returning_count||0} returning · ${block.exited_count||0} exited`
    :"no latest-scan data";
  const head=`<div class="prog-head">
    <span class="chip info"><b>${esc(p.expected_holding_period_td||"?")} trading days</b></span>
    <span>${counts}</span>
    <span title="canonical: ${esc(p.verdict||"UNKNOWN")}">Validation: ${badge(verdictLabel(p.verdict))}</span>
    <span>${topEv}</span>
    ${ls&&ls.scan_readiness?`<span title="scan integrity">${badge(ls.scan_readiness)}</span>`:""}
  </div>`;
  const body=block
    ?candidateList(pid,block)
    :`<div class="note">No latest-scan data — run ./scripts/run_research_cycle.sh latest-scan-programs</div>`;
  return card(`${esc(p.name||pid)}`,
    head+body+programDetails(pid,p,routing,ls));
}

/* ══════════════════════════════════════════════════════════════════════
   Decision-support render layer (presentation only).  All ordering, scores,
   classifications, and counts come straight from the artifacts; nothing here
   re-ranks or mutates them.  The user-facing risk term is
   "Business Deterioration Risk" (the internal payload key is read as-is;
   only the visible label is renamed).
   ═════════════════════════════════════════════════════════════════════ */
const HC_CLASS_LABELS={HIGH_CONVICTION:"High Conviction",PROMISING:"Promising",
  WATCH_FOR_ENTRY:"Watch for Entry",QUALITY_BUT_EXTENDED:"Quality but Extended",
  IMPROVING_BUT_UNPROVEN:"Improving but Unproven"};
/* classification → clean tier badge (canonical value kept in title attr) */
const CLS_BADGE_TONE={HIGH_CONVICTION:"hc",PROMISING:"pr",WATCH_FOR_ENTRY:"wf"};
function clsBadge(classification){
  if(!classification) return "";
  const tone=CLS_BADGE_TONE[classification]||"wf";
  return `<span class="cls-bdg ${tone}" title="canonical: ${esc(classification)}">${esc(HC_CLASS_LABELS[classification]||classification)}</span>`;
}
/* forward-validation display labels (canonical value preserved in payload) */
const FWD_LABELS={NEED_MORE_DATA:"In Progress",
  INSUFFICIENT_MATURE_EVIDENCE:"Insufficient Evidence",
  PROMISING_BUT_UNPROVEN:"Promising, Unproven",VALIDATED_EDGE:"Validated Edge",
  NO_EVIDENCE_OF_EDGE:"No Evidence of Edge"};
const fwdLabel=(v,fv)=>{
  let lab=FWD_LABELS[v]||(v?esc(v):"—");
  // "In Progress" alone understates a zero-matured state — append the
  // matured/required counts when the sidecar's reason carries them.
  if(v==="NEED_MORE_DATA"&&fv&&fv.verdict_reason){
    const m=String(fv.verdict_reason).match(/(\d+)\s+matured.*?(?:need|≥)\s*≥?\s*(\d+)/);
    if(m) lab+=` (${m[1]}/${m[2]} matured)`;
  }
  return lab;
};
/* business-deterioration display label + restrained badge */
const DET_LABELS={LOW:"Low",MEDIUM:"Medium",HIGH:"High",UNKNOWN:"Unknown"};
const detLabel=r=>DET_LABELS[String(r||"").toUpperCase()]||"Unknown";
function detBadge(r){
  const lab=detLabel(r), cls=lab.toLowerCase();
  const tip=lab==="Unknown"?' title="Deterioration data may be insufficient or not applicable for this security."':"";
  return `<span class="det det-${cls}"${tip}>Business Deterioration: ${lab}</span>`;
}
/* view state — presentation only, never touches artifacts.  The HC view
   (cap / program filter / classification filter / compact-vs-detailed /
   neutral-fit visibility) persists across reloads via UIVIEW. */
UIVIEW.hc=Object.assign({cap:6,program:"all",cls:"all",view:"compact",neutralFit:false},UIVIEW.hc||{});
const HCVIEW=UIVIEW.hc;
let EOVIEW={tier:"top"}, EXTVIEW={cap:5};

const FACTOR_ROWS=[["quality_score","Quality"],["growth_score","Growth"],
  ["fundamental_momentum_score","Fundamental Momentum"],
  ["price_momentum_score","Price Momentum"],["value_score","Value"],
  ["risk_integrity_score","Risk Control"]];
function factorBars(cs,valStatus){
  return `<div class="fbars">`+FACTOR_ROWS.map(([k,label])=>{
    const v=cs[k];
    const shown=v!=null?v:(k==="value_score"?esc(valStatus||"n/a"):"—");
    const w=(typeof v==="number")?Math.max(0,Math.min(100,v)):0;
    return `<div class="fbar"><span class="fn">${label}</span>
      <span class="track"><span class="fill" style="width:${w}%"></span></span>
      <span class="fv">${shown}</span></div>`;
  }).join("")+`</div>`;
}
function strengthsRisks(strengths,risks){
  const s=(strengths||[]).length?`<div class="sr-block"><div class="lab">Strengths</div>
    <ul class="sr-list sr-str">${strengths.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:"";
  const r=(risks||[]).length?`<div class="sr-block"><div class="lab">Risks</div>
    <ul class="sr-list sr-risk">${risks.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:"";
  return s+r;
}
/* Any strengths/risks beyond the summary cap, rendered as clean bullets in
   the expanded card — replaces the old repeated joined-string paragraph
   text wall.  Returns "" when nothing new to show. */
function moreStrengthsRisks(strengths,risks,strShown,riskShown){
  const moreS=(strengths||[]).slice(strShown), moreR=(risks||[]).slice(riskShown);
  if(!moreS.length&&!moreR.length) return "";
  const s=moreS.length?`<div class="sr-block"><div class="lab">More strengths</div>
    <ul class="sr-list sr-str">${moreS.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:"";
  const r=moreR.length?`<div class="sr-block"><div class="lab">More risks</div>
    <ul class="sr-list sr-risk">${moreR.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:"";
  return s+r;
}
function integrityBadge(same){
  return same===true?`<span class="bdg g">same-session</span>`
    :same===false?`<span class="bdg a">session mismatch</span>`:"";
}

/* deterministic candidate market-fit — sector vs the current weak/leading
   sectors; never a trade instruction.  Neutral fit is hidden by default
   (it adds no information); aligned/conflicted render as a small badge. */
function marketFit(c,mc){
  if(!mc||!mc.present||(!c.sector_etf&&!c.sector)) return null;
  const etf=(c.sector_etf||"").toUpperCase();
  const weak=((mc.leadership||{}).weak||[]).map(x=>x.toUpperCase());
  const lead=((mc.leadership||{}).leading||[]).map(x=>x.toUpperCase());
  if(etf&&lead.includes(etf)) return {state:"aligned",label:"Sector leading"};
  if(etf&&weak.includes(etf)) return {state:"conflict",label:"Weak sector"};
  return {state:"neutral",label:"Neutral"};
}
function marketFitBadge(c,mc){
  const fit=marketFit(c,mc);
  if(!fit) return "";
  if(fit.state==="neutral")
    return HCVIEW.neutralFit?`<span class="fit-bdg" style="color:var(--dim);border-color:var(--border)">Market fit: Neutral</span>`:"";
  return `<span class="fit-bdg ${fit.state}" title="Market fit vs current sector leadership — context, not an instruction">${esc(fit.label)}</span>`;
}
/* card details block — inline when the section view is Detailed, behind a
   disclosure when Compact.  Same content either way (canonical values). */
function hcCardDetails(c,fwdVerdict,mc){
  const cs=c.component_scores||{};
  const fit=marketFit(c,mc);
  return `${factorBars(cs,c.valuation_status)}
    ${moreStrengthsRisks(c.why_selected,c.main_risks,HCVIEW.view==="detailed"?0:3,HCVIEW.view==="detailed"?0:1)}
    <div class="kv" style="margin-top:6px">
      ${kvRow("Classification",esc(c.classification||"—"))}
      ${kvRow("Forward validation",`<span title="canonical: ${esc(fwdVerdict||"?")}">${fwdLabel(fwdVerdict)}</span>`)}
      ${kvRow("Business Deterioration Risk",detLabel(c.dead_horse_risk))}
      ${fit?kvRow("Market fit",esc(fit.label)):""}
      ${kvRow("Valuation",esc(c.valuation_status||"—"))}
      ${kvRow("Bar / benchmark as-of",esc((c.bar_as_of_date||"?")+" / "+(c.benchmark_as_of_date||"?")))}
      ${kvRow("Same-session",integrityBadge(c.same_session)||"—")}
      ${kvRow("Status",badge("RESEARCH_ONLY"))}
    </div>`;
}
function hcCard(c,rank,fwdVerdict,mc){
  const detailed=HCVIEW.view==="detailed";
  // Compact face shows exceptions only: deterioration above Low, session
  // problems, and non-neutral market fit.  Everything else is one click away.
  const exceptions=[];
  if(String(c.dead_horse_risk||"").toUpperCase()!=="LOW") exceptions.push(detBadge(c.dead_horse_risk));
  if(c.same_session===false) exceptions.push(`<span class="bdg a">session mismatch</span>`);
  const face=detailed
    ?`${strengthsRisks((c.why_selected||[]).slice(0,4),(c.main_risks||[]).slice(0,2))}
      ${hcCardDetails(c,fwdVerdict,mc)}`
    :`${strengthsRisks((c.why_selected||[]).slice(0,3),(c.main_risks||[]).slice(0,1))}
      ${exceptions.length?`<div class="sr-block" style="margin-top:6px">${exceptions.join(" ")}</div>`:""}
      <details class="cand-det"><summary>Full details</summary>${hcCardDetails(c,fwdVerdict,mc)}</details>`;
  return `<div class="hc-card">
    <div class="hdr">
      <div class="idn">${rank?`<span class="rank">${rank}.</span>`:""}
        <span class="tk">${esc(c.ticker)}</span>
        ${marketFitBadge(c,mc)}</div>
      <span class="sc">${esc(c.high_conviction_score)}</span>
    </div>
    <div class="sub">${clsBadge(c.classification)}
      <span>${esc(c.program)} · ${esc(c.holding_period||"")}</span></div>
    ${face}
  </div>`;
}

/* HC toolbar — program filter chips, classification toggles, view mode,
   neutral-fit visibility.  Pure view state: filtering hides cards, never
   reorders them, and the canonical shortlist is untouched. */
const HC_PROGRAMS=[["all","All programs"],["TACTICAL","Tactical"],["SWING","Swing"],["LONG_TERM","Long-Term"]];
const HC_CLASSES=[["all","All tiers"],["HIGH_CONVICTION","High Conviction"],["PROMISING","Promising"],["WATCH_FOR_ENTRY","Watch for Entry"]];
function hcControls(){
  const cap=(v,l)=>`<button class="hc-cap ${HCVIEW.cap===v?"on":""}" data-cap="${v}">${l}</button>`;
  const prog=HC_PROGRAMS.map(([v,l])=>`<button class="hc-prog ${HCVIEW.program===v?"on":""}" data-prog="${v}">${l}</button>`).join("");
  const cls=HC_CLASSES.map(([v,l])=>`<button class="hc-cls ${HCVIEW.cls===v?"on":""}" data-cls="${v}">${l}</button>`).join("");
  return `<div class="sec-ctrls">${cap(6,"Top 6")}${cap(12,"Top 12")}${cap(99999,"View all")}
      <span class="dim" style="font-size:9px">·</span> ${prog}
      <span class="dim" style="font-size:9px">·</span> ${cls}</div>
    <div class="sec-ctrls">
      <button class="hc-view ${HCVIEW.view==="compact"?"on":""}" data-view="compact">Compact</button>
      <button class="hc-view ${HCVIEW.view==="detailed"?"on":""}" data-view="detailed">Detailed</button>
      <button class="hc-fit ${HCVIEW.neutralFit?"on":""}" title="show or hide neutral market-fit badges">Neutral fit ${HCVIEW.neutralFit?"shown":"hidden"}</button>
    </div>`;
}
function hcFiltered(shortlist){
  return shortlist.filter(c=>
    (HCVIEW.program==="all"||c.program===HCVIEW.program)&&
    (HCVIEW.cls==="all"||c.classification===HCVIEW.cls));
}
/* deterministic High-Conviction one-liner from existing fields only */
function hcInterpretation(hc,shown){
  const q=(hc.counts||{}).qualified||0;
  if(!shown.length) return `${q} qualified profiles; no candidates in the current filter.`;
  const progCounts={};
  shown.forEach(c=>{progCounts[c.program]=(progCounts[c.program]||0)+1;});
  const domProg=Object.entries(progCounts).sort((a,b)=>b[1]-a[1])[0][0];
  const cashGen=shown.filter(c=>/profitable/i.test((c.why_selected||[]).join(" "))
    &&/free cash flow/i.test((c.why_selected||[]).join(" "))).length;
  const quality=cashGen>=Math.ceil(shown.length/2)?" profitable, cash-generative and":"";
  return `${q} qualified profiles; top candidates are${quality} mostly ${cap1(domProg.replace(/_/g," "))}-oriented.`;
}

function highConvictionSection(hc,opts){
  opts=opts||{};
  if(!hc||!hc.present){
    return `<div class="hc-wrap"><div class="sec-head"><h2>High-Conviction Alpha</h2></div>
      <div class="hc-sub">Quality + Growth + Value + Momentum</div>
      <div class="note">No shortlist yet — run ./scripts/run_research_cycle.sh high-conviction-alpha</div></div>`;
  }
  const cts=hc.counts||{}, fwd=hc.forward_validation||{};
  const shortlist=hc.shortlist||[];
  const filtered=opts.focus?shortlist:hcFiltered(shortlist);
  const shown=filtered.slice(0,opts.focus?3:HCVIEW.cap);
  const mc=(STATUS||{}).market_context;
  const body=shown.length
    ?`<div class="hc-grid">${shown.map(c=>hcCard(c,shortlist.indexOf(c)+1,fwd.verdict,mc)).join("")}</div>`
    :shortlist.length
      ?`<div class="note">No candidates match the current program / tier filter.</div>`
      :`<div class="note">NO_HIGH_CONVICTION_CANDIDATES — no stock met the qualification standards in the latest scan.</div>`;
  return `<div class="hc-wrap">
    <div class="sec-head"><h2>High-Conviction Alpha</h2>
      <span class="meta">Quality + Growth + Value + Momentum · Forward Validation: ${fwdLabel(fwd.verdict,fwd)}</span></div>
    <div class="interp" style="border-top:none;padding-top:0;margin:0 0 6px">${esc(hcInterpretation(hc,shown))}</div>
    ${hc.stale_for_latest_scan?`<div class="note">High-Conviction list stale vs latest scan</div>`:""}
    ${shortlist.length&&!opts.focus?hcControls():""}
    ${body}
    ${opts.focus?"":rejectedTray(hc.rejected||[])}
  </div>`;
}

/* Did Not Qualify — collapsed, grouped by rejection reason, low emphasis */
const REJ_GROUPS=[
  ["Severe dilution",/dilution/i],
  ["Negative gross margin",/negative gross margin/i],
  ["Business deterioration risk",/deterioration/i],
  ["Data / integrity issue",/quarantine|session|confidence|invalid|bars|liquidity/i],
];
function rejectedTray(rej){
  if(!rej.length) return "";
  const groups=REJ_GROUPS.map(([name,re])=>[name,rej.filter(c=>(c.exclusions||[]).some(e=>re.test(e)))]);
  const seen=new Set(); groups.forEach(([,list])=>list.forEach(c=>seen.add(c.ticker)));
  const other=rej.filter(c=>!seen.has(c.ticker));
  const allGroups=groups.filter(([,l])=>l.length)
    .concat(other.length?[["Other qualification gates",other]]:[]);
  // fixed-width category column + rejected symbols as muted inline tags
  const symTag=c=>`<span class="sym-tag" title="${esc((c.exclusions||[]).join(", "))}">${esc(c.ticker)}</span>`;
  const rows=allGroups.map(([name,list])=>
    `<div class="rc">${esc(name)} <span class="cnt">(${list.length})</span></div>
     <div class="rsyms">${list.map(symTag).join("")}</div>`).join("");
  return `<details class="rej-tray"><summary>Did not qualify — ${rej.length}</summary>
    <div class="rej-table">${rows}</div></details>`;
}

/* Strong Profiles — Wait for Reset (QUALITY_BUT_EXTENDED, top 5) */
function extendedSection(hc){
  const ext=(hc&&hc.quality_but_extended)||[];
  if(!ext.length) return "";
  const shown=ext.slice(0,EXTVIEW.cap);
  const cards=shown.map(c=>{
    const wait=(c.main_risks||[]).length?c.main_risks:[c.extension_state||"extended"];
    return `<div class="ext-card">
      <div><span class="tk">${esc(c.ticker)}</span>
        <span class="dim" style="font-size:10px"> ${esc(c.program)} · ${esc(c.holding_period||"")}</span></div>
      ${strengthsRisks((c.why_selected||[]).slice(0,4),null)}
      <div class="sr-block"><div class="lab">Why wait</div>
        <ul class="sr-list sr-risk">${wait.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    </div>`;
  }).join("");
  return `<div class="ext-wrap">
    <div class="sec-head"><h2>Strong Profiles — Wait for Reset</h2>
      <span class="meta">${ext.length} names · strong business, poor current entry</span></div>
    <div class="ext-grid">${cards}</div>
    ${ext.length>EXTVIEW.cap?`<div class="sec-ctrls"><button class="ext-all ${EXTVIEW.cap>=99999?"on":""}">View all ${ext.length}</button></div>`:""}
  </div>`;
}

/* ── Emerging Opportunities — separate exploratory lane, tiered ── */
function eoCard(w,rank){
  const dims=(w.emergence_dimensions||[]).map(d=>d.detail||d.dimension).slice(0,4);
  const runway=w.cash_runway_quarters!=null?`~${Math.round(w.cash_runway_quarters)}q runway`:"";
  const dil=w.dilution_3q_pct!=null?`dilution ${w.dilution_3q_pct>0?"+":""}${Math.round(w.dilution_3q_pct)}%/3q`:"";
  const risk=[runway,dil].filter(Boolean).join(", ")||"unprofitable";
  return `<div class="eo-card">
    <div><span class="rk">${rank}. </span><span class="tk">${esc(w.ticker)}</span>
      <span class="eo-tag">Emerging</span></div>
    <div class="sub">${esc(w.program)} · ${esc(w.holding_period||"")}</div>
    <div class="sr-block"><div class="lab">Why watched</div>
      <ul class="sr-list sr-str">${dims.map(d=>`<li>${esc(d)}</li>`).join("")}</ul></div>
    <div class="eo-line"><b>Why not High Conviction:</b> ${esc(w.why_not_high_conviction||"")}</div>
    <div class="eo-line"><b>Primary risk:</b> ${esc(risk)}</div>
    ${String(w.business_deterioration_risk||"").toUpperCase()!=="LOW"
      ?`<div class="sr-block" style="margin-top:5px">${detBadge(w.business_deterioration_risk)}
         <span class="dim" style="font-size:9.5px">coverage ${w.data_coverage!=null?Math.round(w.data_coverage*100)+"%":"—"}</span></div>`
      :`<div class="eo-line" style="font-size:9.5px">coverage ${w.data_coverage!=null?Math.round(w.data_coverage*100)+"%":"—"}</div>`}
  </div>`;
}
function emergingSection(eo,opts){
  opts=opts||{};
  if(!eo||!eo.present){
    return `<div class="eo-wrap"><div class="sec-head"><h2>Emerging Opportunities</h2></div>
      <div class="eo-sub">Higher-risk companies showing multi-factor emergence evidence. Separate from High Conviction.</div>
      <div class="note">${eo&&eo.watch_status==="NO_EMERGING_OUTLIERS"
        ?"No emerging opportunities met the multi-factor evidence bar today.":
        "No emerging data — run ./scripts/run_research_cycle.sh emerging-outlier"}</div></div>`;
  }
  const fwd=eo.forward_validation||{};
  const watch=eo.watch||[];
  let slice, label;
  if(opts.focus){slice=watch.slice(0,3);label=`Priority Review · Top 3 of ${watch.length}`;}
  else if(EOVIEW.tier==="secondary"){slice=watch.slice(5,15);label=`Secondary Review · ${Math.min(watch.length-5,10)} of ${watch.length}`;}
  else if(EOVIEW.tier==="all"){slice=watch;label=`Full Emerging Set · ${watch.length}`;}
  else {slice=watch.slice(0,5);label=`Priority Review · Top 5 of ${watch.length}`;}
  const base=(!opts.focus&&EOVIEW.tier==="secondary")?6:1;
  const cards=slice.length
    ?`<div class="eo-grid">${slice.map((w,i)=>eoCard(w,base+i)).join("")}</div>`
    :`<div class="note">No names in this tier.</div>`;
  const mk=(t,l)=>`<button class="eo-tier ${EOVIEW.tier===t?"on":""}" data-tier="${t}">${l}</button>`;
  return `<div class="eo-wrap">
    <div class="sec-head"><h2>Emerging Opportunities</h2>
      <span class="meta">Higher-risk · pre-profit / turnaround · separate from High Conviction</span></div>
    <div class="eo-sub">${label} · ${watch.length} total · Forward Validation: ${fwdLabel(fwd.verdict,fwd)} · not validated alpha</div>
    ${eo.stale_for_latest_scan?`<div class="note">Emerging Outlier list stale vs latest scan</div>`:""}
    ${opts.focus?"":`<div class="sec-ctrls">${mk("top","Top 5")}${mk("secondary","Next 10")}${mk("all","View all "+watch.length)}</div>`}
    ${cards}
  </div>`;
}

/* Triggered-state alerts — Regime Invalidation (red) and Context Tension
   (amber).  Deterministic: rendered only when the engine's own fields fire,
   never authored by an LLM.  Returns "" when nothing is triggered. */
function contextAlerts(mc){
  if(!mc||!mc.present) return "";
  const f=mc.forecast||{}, out=[];
  if(f.invalidation_breached){
    const reasons=(f.invalidation_breach_reasons||[]).map(esc).join(" · ")||"invalidation conditions met";
    out.push(`<div class="alert invalidation-alert"><span class="ai">⛔</span>
